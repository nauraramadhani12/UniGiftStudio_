<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Pengguna | Uni Gift Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
<script>const API_ORIGIN = (['localhost','127.0.0.1'].indexOf(location.hostname) !== -1) ? 'http://localhost:3000' : ''; const CONSUMER_BASE = (['localhost','127.0.0.1'].indexOf(location.hostname) !== -1) ? '../consumer/' : '../';</script>
</head>

<body class="bg-slate-50 text-slate-900 flex h-screen overflow-hidden">

    <aside class="w-64 bg-[#161d31] text-slate-300 flex flex-col justify-between shrink-0">
        <div>
            <div class="h-20 flex items-center px-6 gap-3 border-b border-white/5">
                <div class="w-8 h-8 bg-orange-500 rounded-lg flex items-center justify-center text-white font-bold text-lg">U</div>
                <h1 class="text-xl font-bold text-white">Uni Gift <span class="text-orange-500">Admin</span></h1>
            </div>
            <div class="p-4">
                <p class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-4 px-2">Menu Utama</p>
                <nav class="space-y-1">
                    <a href="dashboard_admin.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/5 transition font-semibold">
                        <span class="text-xl"></span> Dashboard
                    </a>
                    <a href="admin-pesanan.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/5 transition font-semibold">
                        <span class="text-xl"></span> Pesanan
                    </a>
                    <a href="admin-custom-ai.html" class="flex items-center justify-between px-4 py-3 rounded-xl hover:bg-white/5 transition font-semibold">
                        <div class="flex items-center gap-3"><span class="text-xl"></span> Custom AI</div>
                        <span class="bg-orange-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">3 Baru</span>
                    </a>
                    <a href="admin-katalog.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/5 transition font-semibold">
                        <span class="text-xl"></span> Katalog Produk
                    </a>
                    <a href="admin-pengguna.html" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-orange-500 text-white font-semibold shadow-lg shadow-orange-500/20">
                        <span class="text-xl"></span> Manajemen Pengguna
                    </a>
                </nav>
            </div>
        </div>
        <div class="p-4 border-t border-white/5">
            <button onclick="logout()" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/5 transition font-semibold text-slate-400 hover:text-red-400 text-left">Keluar</button>
        </div>
    </aside>

    <div class="flex-1 flex flex-col overflow-hidden">
        <header class="h-20 bg-white border-b border-slate-200 flex items-center justify-between px-8 shrink-0">
            <h2 class="text-xl font-bold text-slate-800">Manajemen Pengguna</h2>
            <div class="flex items-center gap-6">
                <div id="avatar-admin" class="w-10 h-10 bg-orange-100 text-orange-600 font-bold rounded-full flex items-center justify-center border border-orange-200 cursor-pointer">AU</div>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-8">
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                <div class="p-6 border-b border-slate-100 flex flex-col sm:flex-row justify-between gap-4">
                    <div class="flex gap-2">
                        <button onclick="filterRole('all', this)" class="filter-btn bg-slate-900 text-white px-4 py-2 rounded-lg text-sm font-bold transition">Semua</button>
                        <button onclick="filterRole('pelanggan', this)" class="filter-btn bg-white border border-slate-200 text-slate-600 hover:text-orange-500 px-4 py-2 rounded-lg text-sm font-bold transition">Pelanggan</button>
                        <button onclick="filterRole('kreator', this)" class="filter-btn bg-white border border-slate-200 text-slate-600 hover:text-orange-500 px-4 py-2 rounded-lg text-sm font-bold transition">Kreator</button>
                        <button onclick="filterRole('admin', this)" class="filter-btn bg-white border border-slate-200 text-slate-600 hover:text-orange-500 px-4 py-2 rounded-lg text-sm font-bold transition">Admin</button>
                    </div>
                    <input type="text" id="searchInput" oninput="renderRows()" placeholder="Cari nama atau email..." class="bg-slate-50 border border-slate-200 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 w-full sm:w-64">
                </div>

                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 text-slate-400 text-xs uppercase tracking-widest border-b border-slate-200">
                            <th class="p-6 font-bold">Nama Pengguna</th>
                            <th class="p-6 font-bold">Email</th>
                            <th class="p-6 font-bold">Peran</th>
                            <th class="p-6 font-bold">Tanggal Gabung</th>
                            <th class="p-6 font-bold">Status</th>
                            <th class="p-6 font-bold text-right">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="userTbody" class="text-sm font-semibold text-slate-700 divide-y divide-slate-100">
                        <tr>
                            <td colspan="6" class="p-8 text-center text-slate-400">Memuat pengguna...</td>
                        </tr>
                    </tbody>
                </table>

                <div class="p-6 border-t border-slate-100 text-center text-sm text-slate-400 font-semibold" id="tableFooter">Memuat...</div>
            </div>
        </main>
    </div>

    <script>
        const API_BASE = API_ORIGIN + '';

        // ── Auth ──────────────────────────────────────────────────────
        const token = localStorage.getItem('adminToken');
        if (!token) window.location.href = CONSUMER_BASE + 'login.html';

        function authHeader() {
            return {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            };
        }

        function logout() {
            localStorage.removeItem('adminToken');
            localStorage.removeItem('adminUser');
            window.location.href = CONSUMER_BASE + 'login.html';
        }

        const adminUser = JSON.parse(localStorage.getItem('adminUser') || '{}');
        if (adminUser.nama_lengkap) {
            const initials = adminUser.nama_lengkap.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
            document.getElementById('avatar-admin').textContent = initials;
        }

        // ── Config ────────────────────────────────────────────────────
        const ROLE_BADGE = {
            'admin': {
                label: 'Admin',
                cls: 'bg-slate-900 text-white'
            },
            'kreator': {
                label: 'Kreator',
                cls: 'bg-purple-100 text-purple-600'
            },
            'pelanggan': {
                label: 'Pelanggan',
                cls: 'bg-blue-100 text-blue-600'
            },
        };

        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];

        function fmtDate(iso) {
            if (!iso) return '-';
            const d = new Date(iso);
            return `${String(d.getDate()).padStart(2,'0')} ${months[d.getMonth()]} ${d.getFullYear()}`;
        }

        function getInitials(nama) {
            return (nama || '?').split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
        }

        const AVATAR_COLOR = {
            'admin': 'bg-slate-200 text-slate-700',
            'kreator': 'bg-purple-100 text-purple-600',
            'pelanggan': 'bg-orange-100 text-orange-600',
        };

        // ── State ─────────────────────────────────────────────────────
        let allUsers = [];
        let activeFilter = 'all';

        // ── Fetch ─────────────────────────────────────────────────────
        async function loadUsers() {
            try {
                const res = await fetch(`${API_BASE}/api/admin/users`, {
                    headers: authHeader()
                });
                if (res.status === 401 || res.status === 403) {
                    localStorage.removeItem('adminToken');
                    window.location.href = CONSUMER_BASE + 'login.html';
                    return;
                }
                const json = await res.json();
                if (!json.success) throw new Error(json.message);
                allUsers = json.data;
                renderRows();
            } catch (err) {
                document.getElementById('userTbody').innerHTML = `
                    <tr><td colspan="6" class="p-8 text-center text-red-500">Gagal memuat: ${err.message}</td></tr>`;
                document.getElementById('tableFooter').textContent = 'Error';
            }
        }

        // ── Render ────────────────────────────────────────────────────
        function renderRows() {
            const tbody = document.getElementById('userTbody');
            const search = (document.getElementById('searchInput').value || '').toLowerCase();

            const filtered = allUsers.filter(u => {
                const matchRole = activeFilter === 'all' || u.role === activeFilter;
                const matchSearch =
                    (u.nama_lengkap || '').toLowerCase().includes(search) ||
                    (u.email || '').toLowerCase().includes(search);
                return matchRole && matchSearch;
            });

            if (!filtered.length) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-slate-400">Tidak ada pengguna yang cocok.</td></tr>`;
                document.getElementById('tableFooter').textContent = 'Tidak ada hasil';
                return;
            }

            tbody.innerHTML = filtered.map(u => {
                const roleBadge = ROLE_BADGE[u.role] || {
                    label: u.role,
                    cls: 'bg-slate-100 text-slate-600'
                };
                const avatarCls = AVATAR_COLOR[u.role] || 'bg-slate-100 text-slate-600';
                const initials = getInitials(u.nama_lengkap);
                const isBlokir = u.status_akun === 'diblokir';
                const isSelf = adminUser.id === u.id;
                const rowDim = isBlokir ? 'opacity-60' : '';

                const statusBadge = isBlokir ?
                    `<span class="bg-red-100 text-red-600 px-3 py-1 rounded-full text-xs font-bold">Diblokir</span>` :
                    `<span class="bg-green-100 text-green-600 px-3 py-1 rounded-full text-xs font-bold">Aktif</span>`;

                // Admin tidak bisa blokir/hapus dirinya sendiri
                const aksiHtml = isSelf ?
                    `<span class="text-slate-300 text-xs">—</span>` :
                    `<a href="admin-edit-pengguna.html?id=${u.id}" class="text-slate-400 hover:text-blue-500 font-bold transition">Edit</a>
                       <button onclick="toggleBlokir(${u.id}, '${u.status_akun}', this)" class="${isBlokir ? 'text-green-500 hover:text-slate-400' : 'text-slate-400 hover:text-red-500'} font-bold transition ml-3">
                           ${isBlokir ? 'Aktifkan' : 'Blokir'}
                       </button>`;

                return `
                <tr class="hover:bg-slate-50 transition ${rowDim}" data-id="${u.id}">
                    <td class="p-6 font-bold text-slate-900">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 ${avatarCls} rounded-full flex items-center justify-center text-xs shrink-0">${initials}</div>
                            <span>${u.nama_lengkap}</span>
                        </div>
                    </td>
                    <td class="p-6 text-slate-500">${u.email}</td>
                    <td class="p-6"><span class="${roleBadge.cls} px-3 py-1 rounded-full text-xs font-bold">${roleBadge.label}</span></td>
                    <td class="p-6 text-slate-500">${fmtDate(u.created_at)}</td>
                    <td class="p-6">${statusBadge}</td>
                    <td class="p-6 text-right">${aksiHtml}</td>
                </tr>`;
            }).join('');

            document.getElementById('tableFooter').textContent = `Menampilkan ${filtered.length} dari ${allUsers.length} pengguna`;
        }

        // ── Filter tombol ─────────────────────────────────────────────
        function filterRole(role, btn) {
            activeFilter = role;
            document.querySelectorAll('.filter-btn').forEach(b => {
                b.className = 'filter-btn bg-white border border-slate-200 text-slate-600 hover:text-orange-500 px-4 py-2 rounded-lg text-sm font-bold transition';
            });
            btn.className = 'filter-btn bg-slate-900 text-white px-4 py-2 rounded-lg text-sm font-bold transition';
            renderRows();
        }

        // ── Toggle blokir (hit API) ───────────────────────────────────
        async function toggleBlokir(id, statusSekarang, btn) {
            const statusBaru = statusSekarang === 'diblokir' ? 'aktif' : 'diblokir';
            const konfirmasi = statusBaru === 'diblokir' ?
                confirm('Blokir pengguna ini? Mereka tidak bisa login.') :
                confirm('Aktifkan kembali pengguna ini?');

            if (!konfirmasi) return;

            try {
                btn.disabled = true;
                btn.textContent = '...';

                const res = await fetch(`${API_BASE}/api/admin/users/${id}/status`, {
                    method: 'PATCH',
                    headers: authHeader(),
                    body: JSON.stringify({
                        status_akun: statusBaru
                    })
                });
                const json = await res.json();
                if (!json.success) throw new Error(json.message);

                // Update state lokal lalu re-render
                const user = allUsers.find(u => u.id === id);
                if (user) user.status_akun = statusBaru;
                renderRows();

            } catch (err) {
                btn.disabled = false;
                btn.textContent = statusSekarang === 'diblokir' ? 'Aktifkan' : 'Blokir';
                alert('Gagal mengubah status: ' + err.message);
            }
        }

        // ── Init ──────────────────────────────────────────────────────
        window.onload = loadUsers;
    </script>
</body>

</html>
