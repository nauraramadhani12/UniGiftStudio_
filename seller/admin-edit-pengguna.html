<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Pengguna | Uni Gift Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
<script>const API_ORIGIN = (['localhost','127.0.0.1'].indexOf(location.hostname) !== -1) ? 'http://localhost:3000' : ''; const CONSUMER_BASE = (['localhost','127.0.0.1'].indexOf(location.hostname) !== -1) ? '../consumer/' : '../';</script>
</head>

<body class="bg-slate-50 text-slate-900 flex h-screen overflow-hidden">

    <aside class="w-64 bg-[#161d31] text-slate-300 flex flex-col justify-between shrink-0">
        <div>
            <div class="h-20 flex items-center px-6 gap-3 border-b border-white/5">
                <div class="w-8 h-8 bg-orange-500 rounded-lg flex items-center justify-center text-white font-bold text-lg">U</div>
                <h1 class="text-xl font-bold text-white">Uni Gift <span class="text-orange-500">Admin</span></h1>
            </div>
            <div class="p-4">
                <p class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-4 px-2">Menu Utama</p>
                <nav class="space-y-1">
                    <a href="dashboard_admin.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/5 transition font-semibold"><span class="text-xl"></span> Dashboard</a>
                    <a href="admin-pesanan.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/5 transition font-semibold"><span class="text-xl"></span> Pesanan</a>
                    <a href="admin-custom-ai.html" class="flex items-center justify-between px-4 py-3 rounded-xl hover:bg-white/5 transition font-semibold">
                        <div class="flex items-center gap-3"><span class="text-xl"></span> Custom AI</div>
                        <span class="bg-orange-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">3 Baru</span>
                    </a>
                    <a href="admin-katalog.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/5 transition font-semibold"><span class="text-xl"></span> Katalog Produk</a>
                    <a href="admin-pengguna.html" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-orange-500 text-white font-semibold shadow-lg shadow-orange-500/20"><span class="text-xl"></span> Manajemen Pengguna</a>
                </nav>
            </div>
        </div>
        <div class="p-4 border-t border-white/5">
            <button onclick="logout()" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/5 transition font-semibold text-slate-400 hover:text-red-400 text-left">Keluar</button>
        </div>
    </aside>

    <div class="flex-1 flex flex-col overflow-hidden">
        <header class="h-20 bg-white border-b border-slate-200 flex items-center justify-between px-8 shrink-0">
            <div class="flex items-center gap-4">
                <a href="admin-pengguna.html" class="text-slate-400 hover:text-orange-500 transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                </a>
                <h2 class="text-xl font-bold text-slate-800">Edit Profil Pengguna</h2>
            </div>
            <div id="avatar-admin" class="w-10 h-10 bg-orange-100 text-orange-600 font-bold rounded-full flex items-center justify-center border border-orange-200 cursor-pointer">AU</div>
        </header>

        <main class="flex-1 overflow-y-auto p-8 bg-slate-50/50">
            <form onsubmit="event.preventDefault(); simpanPengguna();" class="max-w-4xl mx-auto bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">

                <!-- Header profil -->
                <div class="p-6 md:p-8 border-b border-slate-100 flex items-center gap-6 bg-slate-50/50">
                    <div id="avatarPengguna" class="w-20 h-20 bg-orange-100 rounded-full flex items-center justify-center text-2xl font-black text-orange-600 shrink-0 border-4 border-white shadow-sm">—</div>
                    <div>
                        <h3 id="headerNama" class="text-2xl font-extrabold text-slate-800">Memuat...</h3>
                        <p id="headerEmail" class="text-sm font-bold text-slate-500 mt-1">—</p>
                        <p id="headerGabung" class="text-xs font-semibold text-slate-400 mt-1">—</p>
                    </div>
                </div>

                <div class="p-6 md:p-8 space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                        <div class="md:col-span-2">
                            <label class="block text-xs font-extrabold text-slate-400 uppercase tracking-widest mb-2">Nama Lengkap</label>
                            <input id="inputNama" type="text" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-orange-500 font-bold text-slate-800 transition" required>
                        </div>

                        <div>
                            <label class="block text-xs font-extrabold text-slate-400 uppercase tracking-widest mb-2">Alamat Email</label>
                            <input id="inputEmail" type="email" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-orange-500 font-bold text-slate-800 transition" required>
                        </div>

                        <div>
                            <label class="block text-xs font-extrabold text-slate-400 uppercase tracking-widest mb-2">Peran (Role) Pengguna</label>
                            <select id="selectRole" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-orange-500 font-bold text-slate-800 transition">
                                <option value="pelanggan">Pelanggan (Customer)</option>
                                <option value="kreator">Kreator 3D</option>
                                <option value="admin">Admin Dashboard</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-extrabold text-slate-400 uppercase tracking-widest mb-2">Status Akun</label>
                            <select id="selectStatus" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-orange-500 font-bold text-slate-800 transition">
                                <option value="aktif">Aktif</option>
                                <option value="diblokir">Diblokir (Suspend)</option>
                            </select>
                        </div>

                    </div>
                </div>

                <p id="formMsg" class="hidden px-8 pb-2 text-sm font-bold text-center"></p>

                <div class="p-6 md:p-8 border-t border-slate-100 flex flex-col sm:flex-row justify-end gap-4 bg-slate-50/30">
                    <button type="button" onclick="window.location.href='admin-pengguna.html'" class="px-8 py-3 rounded-xl font-bold text-slate-600 bg-white border border-slate-200 hover:bg-slate-50 hover:text-slate-900 transition">
                        Batal
                    </button>
                    <button type="submit" id="btnSimpan" class="px-8 py-3 rounded-xl font-bold text-white bg-orange-500 hover:bg-orange-600 transition shadow-lg shadow-orange-500/30 flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                        Simpan Profil
                    </button>
                </div>
            </form>
        </main>
    </div>

    <script>
        const API_BASE = API_ORIGIN + '';

        // ── Auth ──────────────────────────────────────────────────────
        const token = localStorage.getItem('adminToken');
        if (!token) window.location.href = CONSUMER_BASE + 'login.html';

        function authHeader() {
            return {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            };
        }

        function logout() {
            localStorage.removeItem('adminToken');
            localStorage.removeItem('adminUser');
            window.location.href = CONSUMER_BASE + 'login.html';
        }

        const adminUser = JSON.parse(localStorage.getItem('adminUser') || '{}');
        if (adminUser.nama_lengkap) {
            const initials = adminUser.nama_lengkap.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
            document.getElementById('avatar-admin').textContent = initials;
        }

        // ── Helpers ───────────────────────────────────────────────────
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];

        function fmtDate(iso) {
            if (!iso) return '-';
            const d = new Date(iso);
            return `${String(d.getDate()).padStart(2,'0')} ${months[d.getMonth()]} ${d.getFullYear()}`;
        }

        function getInitials(nama) {
            return (nama || '?').split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
        }

        // ── Ambil ID dari URL ─────────────────────────────────────────
        const userId = new URLSearchParams(window.location.search).get('id');
        if (!userId) window.location.href = 'admin-pengguna.html';

        // ── Fetch data pengguna ───────────────────────────────────────
        async function loadUser() {
            try {
                const res = await fetch(`${API_BASE}/api/admin/users/${userId}`, {
                    headers: authHeader()
                });
                if (res.status === 401 || res.status === 403) {
                    localStorage.removeItem('adminToken');
                    window.location.href = CONSUMER_BASE + 'login.html';
                    return;
                }
                const json = await res.json();
                if (!json.success) throw new Error(json.message);

                const u = json.data;

                // Header profil
                document.getElementById('avatarPengguna').textContent = getInitials(u.nama_lengkap);
                document.getElementById('headerNama').textContent = u.nama_lengkap;
                document.getElementById('headerEmail').textContent = u.email;
                document.getElementById('headerGabung').textContent = `Bergabung sejak: ${fmtDate(u.created_at)}`;

                // Isi form
                document.getElementById('inputNama').value = u.nama_lengkap;
                document.getElementById('inputEmail').value = u.email;
                document.getElementById('selectRole').value = u.role;
                document.getElementById('selectStatus').value = u.status_akun;

            } catch (err) {
                showMsg('Gagal memuat data: ' + err.message, 'red');
            }
        }

        // ── Simpan perubahan ──────────────────────────────────────────
        async function simpanPengguna() {
            const btn = document.getElementById('btnSimpan');
            const body = {
                nama_lengkap: document.getElementById('inputNama').value.trim(),
                email: document.getElementById('inputEmail').value.trim(),
                role: document.getElementById('selectRole').value,
                status_akun: document.getElementById('selectStatus').value,
            };

            try {
                btn.disabled = true;
                btn.textContent = 'Menyimpan...';
                hideMsg();

                const res = await fetch(`${API_BASE}/api/admin/users/${userId}`, {
                    method: 'PUT',
                    headers: authHeader(),
                    body: JSON.stringify(body)
                });
                const json = await res.json();
                if (!json.success) throw new Error(json.message);

                // Update header langsung
                document.getElementById('headerNama').textContent = body.nama_lengkap;
                document.getElementById('headerEmail').textContent = body.email;
                document.getElementById('avatarPengguna').textContent = getInitials(body.nama_lengkap);

                showMsg('Profil pengguna berhasil diperbarui!', 'green');
                setTimeout(() => window.location.href = 'admin-pengguna.html', 1200);

            } catch (err) {
                showMsg('Gagal menyimpan: ' + err.message, 'red');
                btn.disabled = false;
                btn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> Simpan Profil`;
            }
        }

        function showMsg(text, color) {
            const el = document.getElementById('formMsg');
            el.textContent = text;
            el.className = `px-8 pb-2 text-sm font-bold text-center text-${color}-600`;
            el.classList.remove('hidden');
        }

        function hideMsg() {
            document.getElementById('formMsg').classList.add('hidden');
        }

        window.onload = loadUser;
    </script>
</body>

</html>
