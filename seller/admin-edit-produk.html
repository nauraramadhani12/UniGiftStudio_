<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Produk | Uni Gift Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
<script>const API_ORIGIN = (['localhost','127.0.0.1'].indexOf(location.hostname) !== -1) ? 'http://localhost:3000' : ''; const CONSUMER_BASE = (['localhost','127.0.0.1'].indexOf(location.hostname) !== -1) ? '../consumer/' : '../';</script>
</head>

<body class="bg-slate-50 text-slate-900 flex h-screen overflow-hidden">

    <aside class="w-64 bg-[#161d31] text-slate-300 flex flex-col justify-between shrink-0">
        <div>
            <div class="h-20 flex items-center px-6 gap-3 border-b border-white/5">
                <div class="w-8 h-8 bg-orange-500 rounded-lg flex items-center justify-center text-white font-bold text-lg">U</div>
                <h1 class="text-xl font-bold text-white">Uni Gift <span class="text-orange-500">Admin</span></h1>
            </div>
            <div class="p-4">
                <p class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-4 px-2">Menu Utama</p>
                <nav class="space-y-1">
                    <a href="dashboard_admin.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/5 transition font-semibold"><span class="text-xl"></span> Dashboard</a>
                    <a href="admin-pesanan.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/5 transition font-semibold"><span class="text-xl"></span> Pesanan</a>
                    <a href="admin-custom-ai.html" class="flex items-center justify-between px-4 py-3 rounded-xl hover:bg-white/5 transition font-semibold">
                        <div class="flex items-center gap-3"><span class="text-xl"></span> Custom AI</div>
                        <span class="bg-orange-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">3 Baru</span>
                    </a>
                    <a href="admin-invoice.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/5 transition font-semibold"><span class="text-xl"></span> Invoice</a>
                    <a href="admin-katalog.html" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-orange-500 text-white font-semibold shadow-lg shadow-orange-500/20"><span class="text-xl"></span> Katalog Produk</a>
                    <a href="admin-pengguna.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/5 transition font-semibold"><span class="text-xl"></span> Manajemen Pengguna</a>
                </nav>
            </div>
        </div>
        <div class="p-4 border-t border-white/5">
            <button onclick="logout()" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/5 transition font-semibold text-slate-400 hover:text-red-400 text-left">Keluar</button>
        </div>
    </aside>

    <div class="flex-1 flex flex-col overflow-hidden">
        <header class="h-20 bg-white border-b border-slate-200 flex items-center justify-between px-8 shrink-0">
            <div class="flex items-center gap-4">
                <a href="admin-katalog.html" class="text-slate-400 hover:text-orange-500 transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                </a>
                <h2 id="pageTitle" class="text-xl font-bold text-slate-800">Edit Produk</h2>
            </div>
            <div id="avatar-admin" class="w-10 h-10 bg-orange-100 text-orange-600 font-bold rounded-full flex items-center justify-center border border-orange-200 cursor-pointer">AU</div>
        </header>

        <main class="flex-1 overflow-y-auto p-8 bg-slate-50/50">
            <form onsubmit="event.preventDefault(); simpanProduk();" class="max-w-5xl mx-auto bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">

                <!-- Header form -->
                <div class="p-6 md:p-8 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                    <div>
                        <h3 id="headerNamaProduk" class="text-lg font-extrabold text-slate-800">Produk Baru</h3>
                        <p id="headerKodeProduk" class="text-sm font-bold text-slate-500 mt-1"></p>
                    </div>
                    <span id="headerStatusBadge" class="hidden bg-green-100 text-green-600 px-4 py-1.5 rounded-full text-xs font-extrabold uppercase tracking-wide border border-green-200">Aktif</span>
                </div>

                <div class="p-6 md:p-8 grid grid-cols-1 lg:grid-cols-3 gap-10">

                    <!-- Foto produk -->
                    <div class="lg:col-span-1 space-y-4">
                        <label class="block text-xs font-extrabold text-slate-400 uppercase tracking-widest">Foto Produk (URL)</label>
                        <div id="fotoPreview" class="aspect-square bg-slate-100 rounded-2xl flex flex-col items-center justify-center border-2 border-dashed border-slate-200 overflow-hidden">
                            <span class="text-5xl text-slate-300"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="w-12 h-12"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></span>
                            <p class="text-xs text-slate-400 mt-2">Preview foto</p>
                        </div>
                        <input id="inputFotoUrl" type="url" oninput="previewFoto()" placeholder="https://contoh.com/gambar.jpg" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 font-medium text-slate-700">
                        <p class="text-xs font-semibold text-slate-400 text-center">Masukkan URL gambar produk</p>
                    </div>

                    <!-- Field-field produk -->
                    <div class="lg:col-span-2 space-y-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                            <div class="md:col-span-2">
                                <label class="block text-xs font-extrabold text-slate-400 uppercase tracking-widest mb-2">Nama Produk <span class="text-red-400">*</span></label>
                                <input id="inputNamaProduk" type="text" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-orange-500 font-bold text-slate-800 transition" placeholder="Contoh: Gantungan Kunci Inisial">
                            </div>

                            <div>
                                <label class="block text-xs font-extrabold text-slate-400 uppercase tracking-widest mb-2">Kode Produk</label>
                                <input id="inputKodeProduk" type="text" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-orange-500 font-bold text-slate-800 transition" placeholder="Contoh: PRD-007">
                            </div>

                            <div>
                                <label class="block text-xs font-extrabold text-slate-400 uppercase tracking-widest mb-2">Kategori</label>
                                <select id="selectKategori" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-orange-500 font-bold text-slate-800 transition">
                                    <option value="Gantungan Kunci">Gantungan Kunci</option>
                                    <option value="Mini Statue">Mini Statue</option>
                                    <option value="Kaos Kaki">Kaos Kaki</option>
                                    <option value="Lainnya">Lainnya</option>
                                </select>
                            </div>

                            <div>
                                <label class="block text-xs font-extrabold text-slate-400 uppercase tracking-widest mb-2">Harga Jual (Rp) <span class="text-red-400">*</span></label>
                                <input id="inputHargaJual" type="number" min="0" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-orange-500 font-bold text-slate-800 transition" placeholder="Contoh: 45000">
                            </div>

                            <div>
                                <label class="block text-xs font-extrabold text-slate-400 uppercase tracking-widest mb-2">Harga Asli / Coret (Rp)</label>
                                <input id="inputHargaAsli" type="number" min="0" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-orange-500 font-bold text-slate-800 transition" placeholder="Opsional">
                            </div>

                            <div>
                                <label class="block text-xs font-extrabold text-slate-400 uppercase tracking-widest mb-2">Stok</label>
                                <input id="inputStok" type="number" min="0" value="0" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-orange-500 font-bold text-slate-800 transition">
                            </div>

                            <div>
                                <label class="block text-xs font-extrabold text-slate-400 uppercase tracking-widest mb-2">Status Produk</label>
                                <select id="selectStatus" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-orange-500 font-bold text-slate-800 transition">
                                    <option value="aktif">Aktif (Tersedia)</option>
                                    <option value="habis">Stok Habis</option>
                                    <option value="nonaktif">Sembunyikan</option>
                                </select>
                            </div>

                            <div class="md:col-span-2">
                                <label class="block text-xs font-extrabold text-slate-400 uppercase tracking-widest mb-2">Deskripsi Produk</label>
                                <textarea id="inputDeskripsi" rows="4" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-orange-500 font-medium text-slate-700 transition resize-none" placeholder="Deskripsikan produk ini..."></textarea>
                            </div>
                        </div>
                    </div>
                </div>

                <p id="formMsg" class="hidden px-8 pb-2 text-sm font-bold text-center"></p>

                <div class="p-6 md:p-8 border-t border-slate-100 flex flex-col sm:flex-row justify-end gap-4 bg-slate-50/30">
                    <button type="button" onclick="window.location.href='admin-katalog.html'" class="px-8 py-3 rounded-xl font-bold text-slate-600 bg-white border border-slate-200 hover:bg-slate-50 hover:text-slate-900 transition">
                        Batal
                    </button>
                    <button type="submit" id="btnSimpan" class="px-8 py-3 rounded-xl font-bold text-white bg-orange-500 hover:bg-orange-600 transition shadow-lg shadow-orange-500/30 flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                        <span id="btnLabel">Simpan Perubahan</span>
                    </button>
                </div>
            </form>
        </main>
    </div>

    <script>
        const API_BASE = API_ORIGIN + '';

        // ── Auth ──────────────────────────────────────────────────────
        const token = localStorage.getItem('adminToken');
        if (!token) window.location.href = CONSUMER_BASE + 'login.html';

        function authHeader() {
            return {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            };
        }

        function logout() {
            localStorage.removeItem('adminToken');
            localStorage.removeItem('adminUser');
            window.location.href = CONSUMER_BASE + 'login.html';
        }

        const adminUser = JSON.parse(localStorage.getItem('adminUser') || '{}');
        if (adminUser.nama_lengkap) {
            const initials = adminUser.nama_lengkap.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
            document.getElementById('avatar-admin').textContent = initials;
        }

        // ── Mode: edit atau tambah baru ───────────────────────────────
        const productId = new URLSearchParams(window.location.search).get('id');
        const isEditMode = !!productId;

        if (isEditMode) {
            document.getElementById('pageTitle').textContent = 'Edit Produk';
            document.getElementById('btnLabel').textContent = 'Simpan Perubahan';
        } else {
            document.getElementById('pageTitle').textContent = 'Tambah Produk Baru';
            document.getElementById('btnLabel').textContent = 'Tambah Produk';
            document.getElementById('headerNamaProduk').textContent = 'Produk Baru';
        }

        // ── Preview foto ──────────────────────────────────────────────
        function previewFoto() {
            const url = document.getElementById('inputFotoUrl').value.trim();
            const wrap = document.getElementById('fotoPreview');
            if (url) {
                wrap.innerHTML = `<img src="${url}" class="w-full h-full object-cover" onerror="this.parentElement.innerHTML='<span class=text-5xl><svg xmlns=\\'http://www.w3.org/2000/svg\\' viewBox=\\'0 0 24 24\\' fill=\\'none\\' stroke=\\'currentColor\\' stroke-width=\\'1.75\\' stroke-linecap=\\'round\\' stroke-linejoin=\\'round\\' class=\\'w-12 h-12\\'><circle cx=\\'12\\' cy=\\'12\\' r=\\'10\\'/><path d=\\'m15 9-6 6m0-6 6 6\\'/></svg></span><p class=text-xs text-red-400 mt-2>URL tidak valid</p>'">`;
            } else {
                wrap.innerHTML = `<span class="text-5xl text-slate-300"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="w-12 h-12"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></span><p class="text-xs text-slate-400 mt-2">Preview foto</p>`;
            }
        }

        // ── Fetch data produk (mode edit) ─────────────────────────────
        async function loadProduct() {
            if (!isEditMode) return;

            try {
                const res = await fetch(`${API_BASE}/api/admin/products/${productId}`, {
                    headers: authHeader()
                });
                if (res.status === 401 || res.status === 403) {
                    localStorage.removeItem('adminToken');
                    window.location.href = CONSUMER_BASE + 'login.html';
                    return;
                }
                const json = await res.json();
                if (!json.success) throw new Error(json.message);

                const p = json.data;

                // Header
                document.getElementById('headerNamaProduk').textContent = p.nama_produk;
                document.getElementById('headerKodeProduk').textContent = p.kode_produk ? `ID: #${p.kode_produk}` : '';

                const badge = document.getElementById('headerStatusBadge');
                badge.classList.remove('hidden');
                const badgeMap = {
                    'aktif': ['bg-green-100 text-green-600 border-green-200', 'Aktif'],
                    'habis': ['bg-slate-200 text-slate-600 border-slate-300', 'Habis'],
                    'nonaktif': ['bg-red-100 text-red-500 border-red-200', 'Nonaktif'],
                };
                const [badgeCls, badgeLabel] = badgeMap[p.status_produk] || badgeMap['aktif'];
                badge.className = `${badgeCls} px-4 py-1.5 rounded-full text-xs font-extrabold uppercase tracking-wide border`;
                badge.textContent = `Status: ${badgeLabel}`;

                // Isi form
                document.getElementById('inputNamaProduk').value = p.nama_produk || '';
                document.getElementById('inputKodeProduk').value = p.kode_produk || '';
                document.getElementById('selectKategori').value = p.kategori || 'Gantungan Kunci';
                document.getElementById('inputHargaJual').value = p.harga_jual || '';
                document.getElementById('inputHargaAsli').value = p.harga_asli || '';
                document.getElementById('inputStok').value = p.stok ?? 0;
                document.getElementById('selectStatus').value = p.status_produk || 'aktif';
                document.getElementById('inputDeskripsi').value = p.deskripsi || '';
                document.getElementById('inputFotoUrl').value = p.foto_url || '';

                if (p.foto_url) previewFoto();

            } catch (err) {
                showMsg('Gagal memuat data produk: ' + err.message, 'red');
            }
        }

        // ── Submit form (PUT edit / POST tambah) ──────────────────────
        async function simpanProduk() {
            const btn = document.getElementById('btnSimpan');
            const body = {
                kode_produk: document.getElementById('inputKodeProduk').value.trim() || null,
                nama_produk: document.getElementById('inputNamaProduk').value.trim(),
                kategori: document.getElementById('selectKategori').value,
                harga_jual: Number(document.getElementById('inputHargaJual').value),
                harga_asli: Number(document.getElementById('inputHargaAsli').value) || null,
                stok: Number(document.getElementById('inputStok').value) || 0,
                status_produk: document.getElementById('selectStatus').value,
                deskripsi: document.getElementById('inputDeskripsi').value.trim() || null,
                foto_url: document.getElementById('inputFotoUrl').value.trim() || null,
            };

            try {
                btn.disabled = true;
                document.getElementById('btnLabel').textContent = 'Menyimpan...';
                hideMsg();

                const url = isEditMode ?
                    `${API_BASE}/api/admin/products/${productId}` :
                    `${API_BASE}/api/admin/products`;
                const method = isEditMode ? 'PUT' : 'POST';

                const res = await fetch(url, {
                    method,
                    headers: authHeader(),
                    body: JSON.stringify(body)
                });
                const json = await res.json();
                if (!json.success) throw new Error(json.message);

                showMsg(isEditMode ? 'Produk berhasil diperbarui!' : 'Produk berhasil ditambahkan!', 'green');
                setTimeout(() => window.location.href = 'admin-katalog.html', 1200);

            } catch (err) {
                showMsg('Gagal: ' + err.message, 'red');
                btn.disabled = false;
                document.getElementById('btnLabel').textContent = isEditMode ? 'Simpan Perubahan' : 'Tambah Produk';
            }
        }

        function showMsg(text, color) {
            const el = document.getElementById('formMsg');
            el.textContent = text;
            el.className = `px-8 pb-2 text-sm font-bold text-center text-${color}-600`;
            el.classList.remove('hidden');
        }

        function hideMsg() {
            document.getElementById('formMsg').classList.add('hidden');
        }

        window.onload = loadProduct;
    </script>
</body>

</html>
