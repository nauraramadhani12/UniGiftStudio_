<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beri Ulasan | Uni Gift Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-900 flex flex-col min-h-screen">

    <main class="flex-grow max-w-2xl mx-auto px-4 sm:px-6 py-12 w-full">
        
        <a href="order-history.html" class="inline-flex items-center gap-2 text-sm font-bold text-slate-500 hover:text-orange-500 mb-8 transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Kembali
        </a>

        <div class="bg-white rounded-3xl border border-slate-200 shadow-sm p-8">
            <h2 class="text-2xl font-black text-slate-800 mb-6">Nilai Produk Ini</h2>
            
            <div class="flex gap-4 items-center bg-slate-50 p-4 rounded-2xl border border-slate-100 mb-8">
                <div class="w-16 h-16 bg-orange-100 rounded-xl flex items-center justify-center text-2xl">🧦</div>
                <div>
                    <h3 class="font-extrabold text-slate-800">Custom Pattern Socks</h3>
                    <p class="text-xs font-bold text-slate-500">Pola AI: Kucing Galaxy</p>
                </div>
            </div>

            <div class="mb-8 text-center">
                <p class="font-bold text-slate-500 mb-4">Bagaimana kualitas produknya?</p>
                <div class="flex justify-center gap-2" id="starContainer">
                    </div>
                <p id="ratingText" class="text-orange-500 font-extrabold mt-3 text-sm">Sangat Bagus!</p>
            </div>

            <div class="mb-6">
                <label class="font-bold text-slate-800 mb-2 block">Tuliskan pengalamanmu</label>
                <textarea rows="4" placeholder="Misalnya: Kualitas sablonnya bagus, bahannya adem..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-4 focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20 transition font-medium text-slate-700"></textarea>
            </div>

            <button onclick="alert('Ulasan berhasil dikirim! Terima kasih, Naura.'); window.location.href='order-history.html';" class="w-full bg-[#1e1b4b] text-white py-4 rounded-xl font-bold tracking-widest hover:bg-orange-500 transition shadow-lg shadow-slate-200">
                KIRIM ULASAN
            </button>
        </div>
    </main>

    <script>
        // Logika Bintang Interaktif
        const starContainer = document.getElementById('starContainer');
        const ratingText = document.getElementById('ratingText');
        const labels = ["Sangat Buruk", "Buruk", "Lumayan", "Bagus", "Sangat Bagus!"];
        let currentRating = 5;

        function renderStars() {
            starContainer.innerHTML = '';
            for (let i = 1; i <= 5; i++) {
                let colorClass = i <= currentRating ? 'text-yellow-400' : 'text-slate-200';
                starContainer.innerHTML += `
                    <svg onclick="setRating(${i})" class="w-10 h-10 cursor-pointer hover:scale-110 transition-transform ${colorClass}" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path>
                    </svg>
                `;
            }
            ratingText.innerText = labels[currentRating - 1];
        }

        function setRating(rating) {
            currentRating = rating;
            renderStars();
        }

        renderStars(); // Render pertama kali
    </script>
</body>
</html>
