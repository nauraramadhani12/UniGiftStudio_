<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice | Uniinside Craft</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; }
        @media print {
            @page { margin: 14mm; }
            body { background: #fff; }
            .no-print { display: none !important; }
            .cetak-kartu { box-shadow: none !important; border: none !important; }
        }
    </style>
<script>const API_ORIGIN = (['localhost','127.0.0.1'].indexOf(location.hostname) !== -1) ? 'http://localhost:3000' : '';</script>
<script src="../shared/invoice-common.js"></script>
</head>
<body class="text-slate-800 min-h-screen">

    <main class="max-w-3xl mx-auto p-4 md:p-8">
        <div class="no-print flex justify-between items-center mb-4">
            <a href="order-history.html" class="text-sm font-bold text-slate-400 hover:text-orange-500">← Riwayat Pesanan</a>
            <button onclick="window.print()" class="bg-slate-900 hover:bg-orange-500 text-white font-bold text-sm px-5 py-2.5 rounded-xl transition">Cetak / Simpan PDF</button>
        </div>
        <div id="konten" class="cetak-kartu bg-white rounded-2xl border border-slate-200 shadow-sm p-6 md:p-10">
            <p class="text-center text-slate-400 py-20">Memuat invoice...</p>
        </div>
    </main>

    <script>
        const API_BASE = API_ORIGIN + '';
        const params = new URLSearchParams(location.search);
        const token = params.get('token');

        async function muat() {
            const konten = document.getElementById('konten');
            if (!token) {
                konten.innerHTML = '<p class="text-center text-red-500 py-20">Link invoice tidak valid.</p>';
                return;
            }
            try {
                const res = await fetch(`${API_BASE}/api/invoices/token/${encodeURIComponent(token)}`);
                const json = await res.json();
                if (!json.success) {
                    konten.innerHTML = '<p class="text-center text-red-500 py-20">Invoice tidak ditemukan. Periksa kembali link-nya.</p>';
                    return;
                }
                render(json.data);
                if (params.get('print') === '1') setTimeout(() => window.print(), 400);
            } catch (e) {
                konten.innerHTML = '<p class="text-center text-red-500 py-20">Gagal terhubung ke server.</p>';
            }
        }

        function baris(s) {
            if (s.tipe_item !== 'custom') {
                return `<div class="text-xs text-slate-500">${rupiah(s.harga_satuan)} / pcs</div>`;
            }
            const cat = s.pakai_cat
                ? `${s.jumlah_warna} warna × ${rupiah(s.tarif_warna)} + kerumitan ${INVOICE_KERUMITAN_LABEL[s.tingkat_kerumitan] || ''} ${rupiah(s.biaya_kerumitan)} = ${rupiah(s.biaya_cat)}`
                : 'Tanpa cat';
            return `
                <div class="text-xs text-slate-500 mt-1 space-y-0.5">
                    <div>Cetak: ${Number(s.berat_gram)} gr × ${rupiah(s.tarif_cetak_per_gram)}/gr (${INVOICE_TIER_LABEL[s.tier_cetak] || ''}) = ${rupiah(s.biaya_cetak)}</div>
                    <div>Desain ${INVOICE_PAKET_LABEL[s.paket_desain] || ''}: ${rupiah(s.biaya_desain)}</div>
                    <div>Cat: ${cat}</div>
                </div>`;
        }

        function render(inv) {
            const tanggal = tanggalInvoice(inv.created_at);
            document.getElementById('konten').innerHTML = `
                <header class="flex flex-wrap justify-between gap-6 pb-6 border-b border-slate-200">
                    <div>
                        <h1 class="text-2xl font-extrabold text-slate-900">Uniinside Craft</h1>
                        <p class="text-sm text-slate-500">UniGiftStudio</p>
                    </div>
                    <div class="text-right">
                        <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">Invoice</p>
                        <p class="font-mono font-bold">${esc(inv.nomor_invoice)}</p>
                        <p class="text-sm text-slate-500">${tanggal}</p>
                        <div class="mt-2 inline-block">${badgeStatus(inv.status)}</div>
                    </div>
                </header>

                <section class="grid grid-cols-1 md:grid-cols-2 gap-6 py-6 text-sm">
                    <div>
                        <p class="text-xs font-bold text-slate-400 uppercase">Kepada</p>
                        <p class="font-bold">${esc(inv.nama_pemesan)}</p>
                        <p class="text-slate-500">${esc(inv.nomor_wa || '')}</p>
                        <p class="text-slate-500">${esc(inv.alamat || '')}</p>
                    </div>
                    <div>
                        <p class="text-xs font-bold text-slate-400 uppercase">Pembayaran</p>
                        <p class="text-slate-600 whitespace-pre-line">${esc(inv.info_pembayaran || 'Hubungi admin untuk info rekening pembayaran.')}</p>
                    </div>
                </section>

                <table class="w-full text-sm">
                    <thead>
                        <tr class="text-left text-xs uppercase tracking-widest text-slate-400 border-b border-slate-200">
                            <th class="py-3">Item</th><th class="py-3 text-right">Qty</th><th class="py-3 text-right">Harga</th><th class="py-3 text-right">Subtotal</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                        ${inv.items.map(s => `
                        <tr class="align-top">
                            <td class="py-3 pr-4">
                                <div class="font-bold text-slate-900">${esc(s.nama_item)}</div>
                                ${baris(s)}
                            </td>
                            <td class="py-3 text-right">${s.qty}</td>
                            <td class="py-3 text-right whitespace-nowrap">${s.tipe_item === 'custom' ? '—' : rupiah(s.harga_satuan)}</td>
                            <td class="py-3 text-right font-bold whitespace-nowrap">${rupiah(s.subtotal)}</td>
                        </tr>`).join('')}
                    </tbody>
                </table>

                <section class="mt-6 ml-auto max-w-xs space-y-1 text-sm">
                    <div class="flex justify-between"><span class="text-slate-500">Subtotal</span><span>${rupiah(inv.subtotal)}</span></div>
                    <div class="flex justify-between"><span class="text-slate-500">Ongkir</span><span>${rupiah(inv.ongkir)}</span></div>
                    <div class="flex justify-between"><span class="text-slate-500">Diskon</span><span>- ${rupiah(inv.diskon)}</span></div>
                    <div class="flex justify-between border-t border-slate-200 pt-2 text-base font-extrabold"><span>TOTAL</span><span class="text-orange-600">${rupiah(inv.total)}</span></div>
                </section>

                ${inv.catatan ? `<section class="mt-8 text-sm"><p class="text-xs font-bold text-slate-400 uppercase">Catatan</p><p class="text-slate-600 whitespace-pre-line">${esc(inv.catatan)}</p></section>` : ''}
                ${inv.kurir ? `<p class="mt-4 text-sm text-slate-500">Dikirim via ${esc(inv.kurir)}${inv.nomor_resi ? ' · Resi ' + esc(inv.nomor_resi) : ''}</p>` : ''}
            `;
        }

        muat();
    </script>
</body>
</html>
