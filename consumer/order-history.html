<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Pesanan | Uni Gift Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 flex flex-col min-h-screen">

    <nav class="glass sticky top-0 z-50 border-b border-slate-200">
        <div class="max-w-7xl mx-auto flex justify-between items-center p-5">
            <div class="flex items-center gap-2">
                <div class="w-10 h-10 bg-orange-500 rounded-xl flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-orange-200">U</div>
                <h1 class="text-2xl font-extrabold tracking-tight">Uni Gift <span class="text-orange-500">Studio</span></h1>
            </div>
            <div class="hidden md:flex space-x-10 font-semibold text-slate-600">
                <a href="index.html" class="hover:text-orange-500 transition">Home</a>
                <a href="products.html" class="hover:text-orange-500 transition">Products</a>
                <a href="custom-ai.html" class="hover:text-orange-500 transition">Custom AI</a>
            </div>
            <div class="flex items-center gap-6">
                <a href="cart.html" class="relative text-slate-600 hover:text-orange-500 transition group">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                    <span id="cartBadgeHistory" class="absolute -top-2 -right-2 bg-orange-500 text-white text-[10px] font-bold w-5 h-5 flex items-center justify-center rounded-full border-2 border-white hidden">0</span>
                </a>
                <div class="relative cursor-pointer flex items-center gap-2 text-slate-700 font-bold hover:text-orange-500 transition" onclick="logout()">
                    <div id="userInisial" class="w-9 h-9 bg-slate-900 text-white rounded-full flex items-center justify-center text-sm">NA</div>
                    <span id="userName" class="hidden sm:block">Naura</span>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-5xl mx-auto px-4 sm:px-6 py-8 md:py-12 w-full">
        <h2 class="text-3xl font-extrabold mb-8 text-slate-800">Riwayat Pesanan</h2>

        <div class="flex items-center gap-3 overflow-x-auto no-scrollbar pb-4 mb-6 border-b border-slate-200" id="tabContainer">
            <button onclick="filterOrders('all', this)" class="tab-btn active shrink-0 px-6 py-2.5 rounded-full text-sm font-bold transition bg-[#1e1b4b] text-white shadow-lg shadow-slate-200 border border-[#1e1b4b]">Semua Pesanan</button>
            <button onclick="filterOrders('belum_bayar', this)" class="tab-btn shrink-0 px-6 py-2.5 rounded-full text-sm font-bold transition bg-white text-slate-600 border border-slate-200 hover:border-orange-500 hover:text-orange-500 hover:bg-orange-50">Belum Bayar <span id="countBelumBayar" class="bg-red-500 text-white text-[10px] px-1.5 py-0.5 rounded-full ml-1 hidden">0</span></button>
            <button onclick="filterOrders('diproses', this)" class="tab-btn shrink-0 px-6 py-2.5 rounded-full text-sm font-bold transition bg-white text-slate-600 border border-slate-200 hover:border-orange-500 hover:text-orange-500 hover:bg-orange-50">Diproses</button>
            <button onclick="filterOrders('dikirim', this)" class="tab-btn shrink-0 px-6 py-2.5 rounded-full text-sm font-bold transition bg-white text-slate-600 border border-slate-200 hover:border-orange-500 hover:text-orange-500 hover:bg-orange-50">Dikirim</button>
            <button onclick="filterOrders('selesai', this)" class="tab-btn shrink-0 px-6 py-2.5 rounded-full text-sm font-bold transition bg-white text-slate-600 border border-slate-200 hover:border-orange-500 hover:text-orange-500 hover:bg-orange-50">Selesai</button>
            <button onclick="filterOrders('custom_ai', this)" class="tab-btn shrink-0 px-6 py-2.5 rounded-full text-sm font-bold transition bg-white text-slate-600 border border-slate-200 hover:border-orange-500 hover:text-orange-500 hover:bg-orange-50">Custom AI</button>
        </div>

        <div class="flex flex-col gap-6" id="ordersContainer">
            <div class="text-center py-20">
                <div class="w-10 h-10 border-4 border-orange-500/20 border-t-orange-500 rounded-full animate-spin mx-auto mb-4"></div>
                <p class="text-slate-500 font-bold">Memuat riwayat pesananmu dari database...</p>
            </div>
        </div>

        <div class="flex flex-col gap-4 hidden" id="aiRequestsContainer"></div>
    </main>

    <script>
        const userData = JSON.parse(localStorage.getItem('userSession'));

        window.onload = function() {
            if (!userData) {
                alert("Harap login terlebih dahulu!");
                window.location.href = 'login.html';
                return;
            }

            // Atur nama di navbar
            const namaDepan = userData.nama_lengkap.split(' ')[0];
            document.getElementById('userName').innerText = namaDepan;
            document.getElementById('userInisial').innerText = namaDepan.substring(0, 2).toUpperCase();

            // Tarik data riwayat pesanan
            fetchOrders();
            updateCartBadge();
        };

        function updateCartBadge() {
            const badge = document.getElementById('cartBadgeHistory');
            if (!badge) return;
            
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            let totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            
            if (totalItems > 0) {
                badge.innerText = totalItems;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        function logout() {
            if(confirm('Apakah kamu yakin ingin keluar?')) {
                localStorage.removeItem('userSession');
                localStorage.removeItem('cart');
                window.location.href = 'login.html';
            }
        }

        function formatRupiah(number) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number);
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
        }

        async function fetchOrders() {
            try {
                const response = await fetch(`http://localhost:3000/api/orders/${userData.id}`);
                const orders = await response.json();
                renderOrders(orders);
            } catch (error) {
                document.getElementById('ordersContainer').innerHTML = '<p class="text-center text-red-500 font-bold py-10">Gagal terhubung ke server backend.</p>';
            }
        }

        function renderOrders(orders) {
            const container = document.getElementById('ordersContainer');
            container.innerHTML = '';

            let countBelumBayar = 0;

            if (orders.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-16 bg-white rounded-3xl border border-slate-200">
                        <span class="text-6xl block mb-4"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="w-14 h-14 mx-auto"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg></span>
                        <h3 class="text-xl font-bold text-slate-800 mb-2">Belum Ada Pesanan</h3>
                        <p class="text-slate-500 mb-6">Yuk, mulai kustomisasi AI dan belanja souvenir pertamamu!</p>
                        <button onclick="window.location.href='products.html'" class="bg-orange-500 text-white px-8 py-3 rounded-xl font-bold hover:bg-orange-600 transition">Mulai Belanja</button>
                    </div>`;
                return;
            }

            // Helper: group items by seller
            function groupBySeller(items) {
                const map = {};
                (items || []).forEach(item => {
                    const key = item.creator_id || 'unknown';
                    const label = item.nama_kreator || 'Uni Gift Studio';
                    if (!map[key]) map[key] = { nama_kreator: label, items: [] };
                    map[key].items.push(item);
                });
                return Object.values(map);
            }

            orders.forEach(order => {
                let badgeClass = '', badgeText = '', actionBtn = '';

                if (order.status_pesanan === 'belum_bayar') {
                    badgeClass = 'bg-red-100 text-red-600';
                    badgeText = 'Belum Bayar';
                    actionBtn = `<button onclick="window.location.href='invoice.html?id=${order.id}'" class="bg-orange-500 text-white px-6 py-2.5 rounded-xl font-bold hover:bg-orange-600 transition shadow-md text-sm">Bayar Sekarang</button>`;
                    countBelumBayar++;
                } else if (order.status_pesanan === 'diproses') {
                    badgeClass = 'bg-yellow-100 text-yellow-600';
                    badgeText = 'Sedang Diproses';
                    actionBtn = `<button onclick="window.location.href='invoice.html?id=${order.id}'" class="bg-slate-900 text-white px-6 py-2.5 rounded-xl font-bold hover:bg-orange-500 transition shadow-md text-sm">Lihat Invoice</button>`;
                } else if (order.status_pesanan === 'dikirim') {
                    badgeClass = 'bg-blue-100 text-blue-600';
                    badgeText = 'Sedang Dikirim';
                    const kurirInfo = order.kurir ? `
                        <div class="inline-flex flex-col items-end gap-1">
                            <span class="text-xs bg-blue-50 border border-blue-200 text-blue-700 px-3 py-1.5 rounded-lg font-semibold">Kurir: ${order.kurir}</span>
                            ${order.nomor_resi ? `<span class="text-xs bg-slate-50 border border-slate-200 text-slate-600 px-3 py-1.5 rounded-lg font-mono">Resi: ${order.nomor_resi}</span>` : ''}
                        </div>` : '';
                    actionBtn = `
                        <div class="flex flex-col sm:flex-row items-end sm:items-center gap-3">
                            ${kurirInfo}
                            <button onclick="window.location.href='invoice.html?id=${order.id}'" class="bg-slate-900 text-white px-6 py-2.5 rounded-xl font-bold hover:bg-orange-500 transition shadow-md text-sm">Lihat Invoice</button>
                        </div>`;
                } else if (order.status_pesanan === 'selesai') {
                    badgeClass = 'bg-green-100 text-green-600';
                    badgeText = 'Selesai';
                    actionBtn = `<button onclick="window.location.href='invoice.html?id=${order.id}'" class="bg-slate-900 text-white px-6 py-2.5 rounded-xl font-bold hover:bg-orange-500 transition shadow-md text-sm">Lihat Invoice</button>`;
                } else {
                    badgeClass = 'bg-slate-100 text-slate-600';
                    badgeText = 'Dibatalkan';
                    actionBtn = `<button onclick="window.location.href='invoice.html?id=${order.id}'" class="bg-slate-900 text-white px-6 py-2.5 rounded-xl font-bold hover:bg-orange-500 transition shadow-md text-sm">Lihat Invoice</button>`;
                }

                // Kelompokkan items per seller
                const sellerGroups = groupBySeller(order.items);

                const sellerBlocksHtml = sellerGroups.map(group => {
                    const subtotal = group.items.reduce((s, i) => s + (i.harga_satuan * i.kuantitas), 0);
                    const itemsHtml = group.items.map(item => {
                        const imgHtml = item.foto_url
                            ? `<img src="${item.foto_url}" class="w-full h-full object-cover rounded-xl" onerror="this.parentElement.innerHTML='<span class=\\'text-2xl\\'><svg xmlns=\\'http://www.w3.org/2000/svg\\' viewBox=\\'0 0 24 24\\' fill=\\'none\\' stroke=\\'currentColor\\' stroke-width=\\'1.75\\' stroke-linecap=\\'round\\' stroke-linejoin=\\'round\\' class=\\'w-6 h-6\\'><rect x=\\'3\\' y=\\'8\\' width=\\'18\\' height=\\'13\\' rx=\\'1\\'/><path d=\\'M3 8h18M12 8v13M12 8c-1.5-3-5-4-6-2s1 3 3 2 3-1 3-3-1.5-3-3-3\\'/><path d=\\'M12 8c1.5-3 5-4 6-2s-1 3-3 2-3-1-3-3 1.5-3 3-3\\'/></svg></span>'">`
                            : `<span class="text-2xl"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6"><rect x="3" y="8" width="18" height="13" rx="1"/><path d="M3 8h18M12 8v13M12 8c-1.5-3-5-4-6-2s1 3 3 2 3-1 3-3-1.5-3-3-3"/><path d="M12 8c1.5-3 5-4 6-2s-1 3-3 2-3-1-3-3 1.5-3 3-3"/></svg></span>`;
                        
                        let reviewBtnHtml = '';
                        if (order.status_pesanan === 'selesai') {
                            if (item.review_rating !== null && item.review_rating !== undefined) {
                                reviewBtnHtml = `
                                    <div class="mt-2 flex items-center gap-1 text-xs text-yellow-500 font-bold">
                                        <span>★ ${item.review_rating}</span>
                                        <span class="text-slate-400 font-semibold">(Sudah Diulas)</span>
                                    </div>`;
                            } else {
                                reviewBtnHtml = `
                                    <button onclick="event.stopPropagation(); openReviewModal(${order.id}, ${item.product_id}, '${item.nama_produk.replace(/'/g, "\\'")}')" class="mt-2 text-xs bg-orange-50 hover:bg-orange-500 hover:text-white border border-orange-200 text-orange-600 px-3 py-1 rounded-lg font-bold transition shadow-sm inline-block">
                                        Beri Nilai
                                    </button>`;
                            }
                        }

                        return `
                             <div class="flex gap-4 items-center py-3 border-b border-slate-50 last:border-0">
                                 <div class="w-16 h-16 bg-slate-100 rounded-xl flex items-center justify-center shrink-0 overflow-hidden">${imgHtml}</div>
                                 <div class="flex-1 min-w-0">
                                     <p class="font-bold text-slate-800 text-sm truncate">${item.nama_produk}</p>
                                     <p class="text-xs text-slate-400 mt-0.5">
                                         ${item.kuantitas} × ${formatRupiah(item.harga_satuan)}
                                         ${item.varian ? ` &middot; Varian: ${item.varian}` : ''}
                                     </p>
                                     ${reviewBtnHtml}
                                 </div>
                                 <p class="font-bold text-slate-700 text-sm shrink-0">${formatRupiah(item.harga_satuan * item.kuantitas)}</p>
                             </div>`;
                    }).join('');

                    return `
                        <div class="border border-slate-100 rounded-2xl overflow-hidden mb-3 last:mb-0">
                            <!-- Seller header -->
                            <div class="bg-slate-50 px-4 py-2.5 flex items-center gap-2 border-b border-slate-100">
                                <div class="w-6 h-6 bg-orange-500 rounded-full flex items-center justify-center text-white text-[10px] font-black shrink-0">
                                    ${group.nama_kreator.charAt(0).toUpperCase()}
                                </div>
                                <span class="text-xs font-bold text-slate-700">${group.nama_kreator}</span>
                            </div>
                            <!-- Items -->
                            <div class="px-4 pt-1 pb-2">${itemsHtml}</div>
                            <!-- Subtotal seller -->
                            <div class="bg-orange-50/50 px-4 py-2.5 flex justify-between items-center border-t border-orange-100">
                                <span class="text-xs text-slate-500">Subtotal (${group.items.length} produk)</span>
                                <span class="text-sm font-black text-orange-600">${formatRupiah(subtotal)}</span>
                            </div>
                        </div>`;
                }).join('');

                const cardHtml = `
                    <div class="order-card ${order.status_pesanan} bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden hover:shadow-md transition-shadow mb-4">
                        <!-- Order header -->
                        <div class="bg-slate-50 border-b border-slate-100 px-6 py-4 flex justify-between items-center cursor-pointer hover:bg-slate-100/80 transition duration-200 group" onclick="window.location.href='invoice.html?id=${order.id}'">
                            <div class="text-sm font-extrabold text-slate-800 flex items-center gap-2">
                                <span class="group-hover:text-orange-500 transition duration-200">#${order.kode_pesanan}</span>
                                <span class="text-slate-400 font-medium">${formatDate(order.created_at)}</span>
                                <span class="text-[11px] bg-orange-50 text-orange-600 px-2.5 py-0.5 rounded-full font-bold ml-1 opacity-0 group-hover:opacity-100 transition-opacity duration-200">Lihat Detail &rarr;</span>
                            </div>
                            <span class="${badgeClass} px-3 py-1.5 rounded-lg text-xs font-extrabold uppercase tracking-wide">${badgeText}</span>
                        </div>
                        <!-- Seller groups -->
                        <div class="p-4">${sellerBlocksHtml}</div>
                        <!-- Footer: total order + action -->
                        <div class="border-t border-slate-100 px-6 py-4 flex justify-between items-center">
                            <div>
                                <span class="text-xs text-slate-400">Total Pesanan</span>
                                <p class="text-lg font-black text-slate-900">${formatRupiah(order.total_bayar)}</p>
                            </div>
                            ${actionBtn ? `<div class="flex flex-col items-end gap-2">${actionBtn}</div>` : ''}
                        </div>
                    </div>`;

                container.innerHTML += cardHtml;
            });

            // Update Badge Belum Bayar
            const badgeBelumBayar = document.getElementById('countBelumBayar');
            if (countBelumBayar > 0) {
                badgeBelumBayar.innerText = countBelumBayar;
                badgeBelumBayar.classList.remove('hidden');
            }
        }

        // Logika untuk Tab Filter
        function filterOrders(status, btnElement) {
            let tabs = document.querySelectorAll('.tab-btn');
            tabs.forEach(tab => {
                tab.className = "tab-btn shrink-0 px-6 py-2.5 rounded-full text-sm font-bold transition bg-white text-slate-600 border border-slate-200 hover:border-orange-500 hover:text-orange-500 hover:bg-orange-50";
            });
            btnElement.className = "tab-btn active shrink-0 px-6 py-2.5 rounded-full text-sm font-bold transition bg-[#1e1b4b] text-white shadow-lg shadow-slate-200 border border-[#1e1b4b]";

            const ordersContainer = document.getElementById('ordersContainer');
            const aiContainer = document.getElementById('aiRequestsContainer');

            if (status === 'custom_ai') {
                ordersContainer.classList.add('hidden');
                aiContainer.classList.remove('hidden');
                fetchAiRequests();
                return;
            }

            ordersContainer.classList.remove('hidden');
            aiContainer.classList.add('hidden');

            let cards = document.querySelectorAll('.order-card');
            cards.forEach(card => {
                if(status === 'all' || card.classList.contains(status)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        // ── Riwayat Custom AI ──────────────────────────────────────────
        const aiStatusBadge = {
            pending:   { cls: 'bg-yellow-100 text-yellow-600', text: 'Menunggu Review Seller' },
            disetujui: { cls: 'bg-green-100 text-green-600',   text: 'Disetujui' },
            ditolak:   { cls: 'bg-red-100 text-red-600',       text: 'Ditolak' }
        };

        async function fetchAiRequests() {
            const aiContainer = document.getElementById('aiRequestsContainer');
            aiContainer.innerHTML = `
                <div class="text-center py-20">
                    <div class="w-10 h-10 border-4 border-orange-500/20 border-t-orange-500 rounded-full animate-spin mx-auto mb-4"></div>
                    <p class="text-slate-500 font-bold">Memuat riwayat Custom AI...</p>
                </div>`;
            try {
                const res = await fetch(`http://localhost:3000/api/user/${userData.id}/ai-requests`);
                const json = await res.json();
                renderAiRequests(json.data || []);
            } catch (error) {
                aiContainer.innerHTML = '<p class="text-center text-red-500 font-bold py-10">Gagal terhubung ke server backend.</p>';
            }
        }

        function renderAiRequests(requests) {
            const aiContainer = document.getElementById('aiRequestsContainer');
            if (requests.length === 0) {
                aiContainer.innerHTML = `
                    <div class="text-center py-16 bg-white rounded-3xl border border-slate-200">
                        <h3 class="text-xl font-bold text-slate-800 mb-2">Belum Ada Request Custom AI</h3>
                        <p class="text-slate-500 mb-6">Yuk, coba kustomisasi desain souvenir pakai AI!</p>
                        <button onclick="window.location.href='custom-ai.html'" class="bg-orange-500 text-white px-8 py-3 rounded-xl font-bold hover:bg-orange-600 transition">Coba Custom AI</button>
                    </div>`;
                return;
            }

            aiContainer.innerHTML = requests.map(r => {
                const badge = aiStatusBadge[r.status_approval] || aiStatusBadge.pending;
                const imgHtml = r.image_url
                    ? `<img src="${r.image_url}" class="w-full h-full object-cover" onerror="this.style.display='none'">`
                    : '';
                return `
                    <div class="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden flex gap-4 p-4">
                        <div class="w-20 h-20 bg-slate-100 rounded-xl shrink-0 overflow-hidden flex items-center justify-center">${imgHtml}</div>
                        <div class="flex-1 min-w-0">
                            <div class="flex justify-between items-start gap-2 mb-1">
                                <p class="font-bold text-slate-800 text-sm line-clamp-2">${r.prompt_text}</p>
                                <span class="shrink-0 text-[10px] font-bold px-2.5 py-1 rounded-full ${badge.cls}">${badge.text}</span>
                            </div>
                            <p class="text-xs text-slate-400">${r.visual_style || '-'} &middot; ${r.material || '-'}</p>
                            <p class="text-xs text-slate-400 mt-1">Seller: ${r.nama_kreator || 'Belum ditentukan'} &middot; ${formatDate(r.created_at)}</p>
                        </div>
                    </div>`;
            }).join('');
        }

        // --- LOGIKA ULASAN/REVIEW BARU ---
        let activeReviewOrder = null;
        let activeReviewProduct = null;
        let selectedRatingValue = 0;

        function openReviewModal(orderId, productId, productName) {
            activeReviewOrder = orderId;
            activeReviewProduct = productId;
            selectedRatingValue = 0;
            document.getElementById('reviewProductName').textContent = productName;
            document.getElementById('reviewComment').value = '';
            setSelectRating(0); // reset stars

            const modal = document.getElementById('reviewModal');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modal.querySelector('.transform').classList.remove('scale-95');
        }

        function closeReviewModal() {
            const modal = document.getElementById('reviewModal');
            modal.classList.add('opacity-0', 'pointer-events-none');
            modal.querySelector('.transform').classList.add('scale-95');
        }

        function setSelectRating(rating) {
            selectedRatingValue = rating;
            const stars = document.querySelectorAll('.star-select');
            stars.forEach((star, index) => {
                if (index < rating) {
                    star.classList.remove('text-slate-200');
                    star.classList.add('text-yellow-400');
                } else {
                    star.classList.remove('text-yellow-400');
                    star.classList.add('text-slate-200');
                }
            });
        }

        async function submitReview() {
            if (selectedRatingValue === 0) {
                alert('Harap pilih bintang ulasan terlebih dahulu!');
                return;
            }

            const btn = document.getElementById('btnSubmitReview');
            const originalText = btn.innerHTML;
            btn.innerHTML = "Mengirim...";
            btn.disabled = true;

            const payload = {
                user_id: userData.id,
                product_id: activeReviewProduct,
                order_id: activeReviewOrder,
                rating: selectedRatingValue,
                komentar: document.getElementById('reviewComment').value.trim()
            };

            try {
                const response = await fetch('http://localhost:3000/api/reviews', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                if (response.ok) {
                    alert('Terima kasih! Ulasan Anda berhasil disimpan.');
                    closeReviewModal();
                    await fetchOrders(); // Reload data pesanan
                } else {
                    alert(result.message || 'Gagal mengirim ulasan.');
                }
            } catch (error) {
                alert('Terjadi kesalahan jaringan.');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }
    </script>

    <!-- MODAL BERI RATING / REVIEW -->
    <div id="reviewModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center opacity-0 pointer-events-none transition-all duration-300">
        <div class="bg-white w-full max-w-md rounded-[2.5rem] shadow-2xl p-8 transform scale-95 transition-all">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-extrabold text-slate-800">Beri Ulasan</h3>
                <button onclick="closeReviewModal()" class="w-10 h-10 flex items-center justify-center rounded-full bg-slate-50 text-slate-400 hover:text-red-500 font-bold transition">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><path d="M18 6 6 18M6 6l12 12"/></svg>
                </button>
            </div>
            
            <div class="mb-5 text-center">
                <p class="text-sm font-semibold text-slate-500 mb-2">Bagaimana kualitas produk berikut?</p>
                <h4 id="reviewProductName" class="font-extrabold text-slate-800 text-lg mb-4">—</h4>
                
                <!-- Star Rating selector -->
                <div class="flex justify-center gap-2 mb-4" id="starSelector">
                    <button type="button" onclick="setSelectRating(1)" class="star-select text-4xl text-slate-200 hover:scale-110 transition-transform">★</button>
                    <button type="button" onclick="setSelectRating(2)" class="star-select text-4xl text-slate-200 hover:scale-110 transition-transform">★</button>
                    <button type="button" onclick="setSelectRating(3)" class="star-select text-4xl text-slate-200 hover:scale-110 transition-transform">★</button>
                    <button type="button" onclick="setSelectRating(4)" class="star-select text-4xl text-slate-200 hover:scale-110 transition-transform">★</button>
                    <button type="button" onclick="setSelectRating(5)" class="star-select text-4xl text-slate-200 hover:scale-110 transition-transform">★</button>
                </div>
            </div>

            <div class="mb-6">
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 ml-1">Komentar (Opsional)</label>
                <textarea id="reviewComment" rows="3" placeholder="Tulis komentar ulasan Anda..." class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-orange-500 transition text-sm font-medium text-slate-700 resize-none"></textarea>
            </div>

            <div class="flex gap-3">
                <button onclick="closeReviewModal()" class="flex-1 py-4 bg-slate-100 text-slate-600 rounded-2xl font-bold hover:bg-slate-200 transition">Batal</button>
                <button id="btnSubmitReview" onclick="submitReview()" class="flex-1 py-4 bg-orange-500 text-white rounded-2xl font-bold shadow-lg shadow-orange-200 hover:bg-orange-600 transition">Kirim</button>
            </div>
        </div>
    </div>
</body>
</html>
