<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Pembayaran | Uni Gift Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        @media print { .no-print { display: none !important; } body { background-color: white; } }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-2xl mx-auto">
        <div class="flex justify-between items-center mb-8 no-print">
            <a href="order-history.html" class="text-slate-500 font-bold hover:text-orange-500">← Semua Pesanan</a>
            <button onclick="window.print()" class="bg-slate-900 text-white px-6 py-2 rounded-lg font-bold hover:bg-orange-500 transition">Print Invoice</button>
        </div>

        <div id="invoiceLoading" class="text-center py-20 bg-white rounded-2xl shadow-sm border border-slate-200">
            <div class="w-10 h-10 border-4 border-orange-500/20 border-t-orange-500 rounded-full animate-spin mx-auto mb-4"></div>
            <p class="text-slate-500 font-bold">Memuat Invoice...</p>
        </div>

        <div id="invoiceContent" class="hidden space-y-6">

            <!-- Header Invoice -->
            <div class="bg-white p-6 md:p-10 rounded-2xl border border-slate-200 shadow-sm">
                <div id="statusBanner" class="mb-8 p-4 rounded-xl font-bold text-center no-print"></div>

                <div class="flex flex-col md:flex-row justify-between items-start border-b border-slate-200 pb-8 mb-8 gap-6">
                    <div>
                        <h1 class="text-3xl font-black text-orange-500 mb-1">INVOICE</h1>
                        <p class="text-slate-500 font-bold text-sm">Pembayaran untuk <span id="jumlahSeller"></span></p>
                    </div>
                    <div class="md:text-right">
                        <h2 class="text-xl font-extrabold text-slate-900">Uni Gift Studio</h2>
                        <p class="text-sm text-slate-500 mt-1">hello@unigift.studio<br>Jakarta, Indonesia</p>
                    </div>
                </div>

                <div class="flex flex-col md:flex-row justify-between mb-8 text-sm gap-6">
                    <div>
                        <p class="font-bold text-slate-400 uppercase tracking-widest text-xs mb-2">Ditagihkan Kepada:</p>
                        <p id="invNama" class="font-extrabold text-slate-800 text-base"></p>
                        <p id="invTelp" class="text-slate-600 font-medium mt-1"></p>
                        <p id="invAlamat" class="text-slate-500 mt-1 max-w-xs leading-relaxed"></p>
                    </div>
                    <div class="md:text-right">
                        <p class="font-bold text-slate-400 uppercase tracking-widest text-xs mb-2">Tanggal Order:</p>
                        <p id="invTanggal" class="font-bold text-slate-800 mb-4"></p>
                        <p class="font-bold text-slate-400 uppercase tracking-widest text-xs mb-2">Metode Pembayaran:</p>
                        <p id="invMetode" class="font-bold text-slate-800"></p>
                    </div>
                </div>
            </div>

            <!-- Per-seller order cards -->
            <div id="sellerOrdersContainer" class="space-y-4"></div>

            <!-- Total Keseluruhan + Bayar -->
            <div class="bg-white p-6 md:p-8 rounded-2xl border border-slate-200 shadow-sm">
                <h3 class="text-base font-bold text-slate-800 mb-4 border-b border-slate-100 pb-3">Ringkasan Pembayaran</h3>
                <div id="summaryRows" class="space-y-2 mb-4"></div>
                <div class="flex justify-between items-center border-t border-slate-200 pt-4 mt-4">
                    <span class="text-lg font-black text-slate-800">Total Tagihan</span>
                    <span id="grandTotal" class="text-2xl font-black text-orange-500"></span>
                </div>

                <div id="simulasiContainer" class="mt-8 pt-6 border-t border-dashed border-orange-200 text-center no-print hidden">
                    <p class="text-sm font-bold text-orange-500 mb-4">--- PEMBAYARAN VIA QRIS ---</p>
                    <div class="bg-orange-50 p-6 rounded-xl border border-orange-200 inline-block text-center mb-6 max-w-full">
                        <p class="text-xs font-bold text-slate-500 mb-2 uppercase tracking-widest">Scan QRIS Ini</p>
                        <img src="assets/images/qris.png" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/a/a2/Logo_QRIS.svg'" class="w-64 max-w-full mx-auto rounded-lg shadow-sm border border-slate-200 bg-white p-2">
                    </div>
                    
                    <div class="max-w-md mx-auto mb-6 text-left">
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2 text-center">Upload Bukti Pembayaran (JPG/PNG)</label>
                        <label class="flex items-center gap-3 cursor-pointer w-full px-4 py-3.5 rounded-xl border-2 border-dashed border-slate-300 bg-slate-50 hover:border-orange-400 transition text-sm font-semibold text-slate-500">
                            <span class="text-lg">📷</span>
                            <span id="uploadLabel">Pilih file bukti transfer...</span>
                            <input id="buktiFile" type="file" accept="image/*" class="hidden" onchange="document.getElementById('uploadLabel').innerText = this.files[0]?.name || 'Pilih file bukti transfer...'">
                        </label>
                    </div>

                    <button onclick="uploadDanBayarSemua()" id="btnBayar" class="bg-green-500 hover:bg-green-600 text-white px-8 py-4 rounded-xl font-black text-lg transition shadow-lg shadow-green-500/30 w-full sm:w-auto">
                        KONFIRMASI PEMBAYARAN
                    </button>
                    <a href="order-history.html" class="block text-center mt-3 text-sm text-slate-500 hover:text-orange-500 transition font-semibold">
                        ← Lihat Semua Pesanan Saya
                    </a>
                </div>
            </div>

        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const groupCode = urlParams.get('group');

        if (!groupCode) {
            alert("Group pesanan tidak ditemukan!");
            window.location.href = 'order-history.html';
        } else {
            fetchGroupInvoice();
        }

        function formatRupiah(n) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(n);
        }
        function formatDate(d) {
            return new Date(d).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
        }

        async function fetchGroupInvoice() {
            try {
                const res = await fetch(`http://localhost:3000/api/orders/group/${groupCode}`);
                const json = await res.json();
                if (res.ok && json.data) {
                    renderInvoice(json.data);
                } else {
                    alert("Pesanan tidak ditemukan!");
                    window.location.href = 'order-history.html';
                }
            } catch (e) {
                alert("Server backend mati!");
            }
        }

        function renderInvoice(orders) {
            document.getElementById('invoiceLoading').classList.add('hidden');
            document.getElementById('invoiceContent').classList.remove('hidden');

            const first = orders[0];
            const allPaid = orders.every(o => o.status_pesanan !== 'belum_bayar');

            // Header
            document.getElementById('jumlahSeller').innerText = `${orders.length} seller`;
            document.getElementById('invNama').innerText = first.nama_penerima;
            document.getElementById('invTelp').innerText = first.nomor_telepon;
            document.getElementById('invAlamat').innerHTML = first.alamat_lengkap;
            document.getElementById('invTanggal').innerText = formatDate(first.created_at);
            document.getElementById('invMetode').innerText = first.metode_pembayaran;

            const banner = document.getElementById('statusBanner');
            if (allPaid) {
                banner.className = "mb-8 p-4 rounded-xl font-bold text-center no-print bg-green-100 text-green-600";
                banner.innerText = "LUNAS — Semua pesanan sedang diproses";
            } else {
                banner.className = "mb-8 p-4 rounded-xl font-bold text-center no-print bg-red-100 text-red-600";
                banner.innerText = "MENUNGGU PEMBAYARAN";
                document.getElementById('simulasiContainer').classList.remove('hidden');
            }

            // Per-seller cards
            const sellerContainer = document.getElementById('sellerOrdersContainer');
            let grandTotal = 0;
            let summaryHtml = '';

            orders.forEach(order => {
                const sellerName = order.items?.[0]?.nama_kreator || 'Seller';
                const itemsHtml = (order.items || []).map(item => `
                    <tr class="border-b border-slate-100">
                        <td class="py-3 pr-4 text-sm">
                            <div>${item.nama_produk}</div>
                            ${item.varian ? `<div class="text-xs text-slate-400 mt-0.5">Varian: ${item.varian}</div>` : ''}
                        </td>
                        <td class="py-3 text-center text-sm">${item.kuantitas}</td>
                        <td class="py-3 text-right text-sm">${formatRupiah(item.harga_satuan)}</td>
                        <td class="py-3 text-right font-extrabold text-slate-900 text-sm">${formatRupiah(item.harga_satuan * item.kuantitas)}</td>
                    </tr>`).join('');

                grandTotal += order.total_bayar;

                summaryHtml += `
                    <div class="flex justify-between text-sm text-slate-600">
                        <span class="flex items-center gap-2">
                            <span class="w-5 h-5 bg-orange-500 rounded-full flex items-center justify-center text-white text-[10px] font-black">${sellerName.charAt(0).toUpperCase()}</span>
                            ${sellerName}
                        </span>
                        <span class="font-bold">${formatRupiah(order.total_bayar)}</span>
                    </div>`;

                sellerContainer.innerHTML += `
                    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                        <div class="flex items-center gap-2 mb-4 pb-3 border-b border-slate-100">
                            <div class="w-8 h-8 bg-orange-500 rounded-full flex items-center justify-center text-white font-black text-sm">${sellerName.charAt(0).toUpperCase()}</div>
                            <div>
                                <p class="font-bold text-slate-800 text-sm">${sellerName}</p>
                                <p class="text-xs text-slate-400">#${order.kode_pesanan}</p>
                            </div>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left min-w-[400px]">
                                <thead>
                                    <tr class="border-b border-slate-200 text-slate-400 text-xs uppercase tracking-widest">
                                        <th class="pb-2 font-bold w-1/2">Produk</th>
                                        <th class="pb-2 font-bold text-center">Qty</th>
                                        <th class="pb-2 font-bold text-right">Harga</th>
                                        <th class="pb-2 font-bold text-right">Total</th>
                                    </tr>
                                </thead>
                                <tbody class="font-semibold text-slate-700">${itemsHtml}</tbody>
                            </table>
                        </div>
                        <div class="mt-3 pt-3 border-t border-slate-100 flex justify-between text-xs text-slate-500">
                            <span>Ongkir (${order.jenis_pengiriman})</span><span>${formatRupiah(order.ongkos_kirim)}</span>
                        </div>
                        <div class="flex justify-between text-xs text-slate-500 mt-1">
                            <span>Biaya Layanan</span><span>${formatRupiah(order.biaya_layanan)}</span>
                        </div>
                        <div class="flex justify-between font-black text-slate-900 mt-2 pt-2 border-t border-slate-100">
                            <span>Subtotal Pesanan</span><span class="text-orange-500">${formatRupiah(order.total_bayar)}</span>
                        </div>
                    </div>`;
            });

            document.getElementById('summaryRows').innerHTML = summaryHtml;
            document.getElementById('grandTotal').innerText = formatRupiah(grandTotal);
        }

        async function uploadDanBayarSemua() {
            const fileInput = document.getElementById('buktiFile');
            if (fileInput.files.length === 0) {
                alert('Harap pilih file bukti pembayaran terlebih dahulu!');
                return;
            }

            const btn = document.getElementById('btnBayar');
            const originalText = btn.innerHTML;
            btn.innerHTML = "Mengupload Bukti...";
            btn.disabled = true;

            try {
                // 1. Upload file
                const formData = new FormData();
                formData.append('file', fileInput.files[0]);
                const uploadRes = await fetch(`http://localhost:3000/api/upload`, {
                    method: 'POST',
                    body: formData
                });
                
                const uploadResult = await uploadRes.json();
                if (!uploadRes.ok || !uploadResult.success) {
                    throw new Error(uploadResult.message || 'Gagal mengupload bukti pembayaran');
                }

                const fileUrl = uploadResult.fileUrl;
                btn.innerHTML = "Memproses Pembayaran...";

                // 2. Kirim URL bukti ke payment API
                const res = await fetch(`http://localhost:3000/api/orders/group/${groupCode}/pay`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ bukti_pembayaran: fileUrl })
                });

                const result = await res.json();
                if (res.ok) {
                    alert(result.pesan);
                    window.location.href = 'order-history.html';
                } else {
                    alert(result.pesan);
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            } catch (e) {
                alert('Gagal konfirmasi pembayaran: ' + e.message);
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
