<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | Uni Gift Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        
        .glass {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
        }
        /* ── Skeleton shimmer ── */
        
        @keyframes shimmer {
            0% {
                background-position: -600px 0;
            }
            100% {
                background-position: 600px 0;
            }
        }
        
        .skeleton {
            background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
            background-size: 600px 100%;
            animation: shimmer 1.4s infinite linear;
            border-radius: 1rem;
        }
        /* ── Card hover overlay ── */
        
        .product-card {
            position: relative;
        }
        
        .product-card .hover-overlay {
            opacity: 0;
            transition: opacity 0.25s ease;
        }
        
        .product-card:hover .hover-overlay {
            opacity: 1;
        }
        
        .product-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.12);
        }
        /* ── Sort dropdown ── */
        
        select {
            cursor: pointer;
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-900">

    <!-- ===== NAVBAR ===== -->
    <nav class="glass sticky top-0 z-50 border-b border-slate-200">
        <div class="max-w-7xl mx-auto flex justify-between items-center p-5">
            <div class="flex items-center gap-2">
                <div class="w-10 h-10 bg-orange-500 rounded-xl flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-orange-200">U</div>
                <h1 class="text-2xl font-extrabold tracking-tight">Uni Gift <span class="text-orange-500">Studio</span></h1>
            </div>
            <div class="hidden md:flex space-x-10 font-semibold text-slate-600">
                <a href="index.html" class="hover:text-orange-500 transition">Home</a>
                <a href="products.html" class="text-orange-600">Products</a>
                <a href="custom-ai.html" class="hover:text-orange-500 transition">✨ Custom AI</a>
            </div>
            <div class="flex items-center gap-6">
                <a href="cart.html" class="relative text-slate-600 hover:text-orange-500 transition group" title="Lihat Keranjang">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                    <span id="cartBadge" class="absolute -top-2 -right-2 bg-orange-500 text-white text-[10px] font-bold w-5 h-5 flex items-center justify-center rounded-full border-2 border-white hidden">0</span>
                </a>
                <a href="login.html" class="font-semibold text-slate-600 hover:text-orange-500 transition">Login</a>
                <a href="register.html" class="bg-slate-900 text-white px-6 py-2.5 rounded-full font-bold hover:bg-orange-600 transition shadow-lg shadow-slate-200 hidden sm:block">Join Now</a>
            </div>
        </div>
    </nav>

    <!-- ===== HEADER ===== -->
    <header class="relative bg-gradient-to-b from-orange-100/50 to-slate-50 pt-16 pb-12 border-b border-slate-200 overflow-hidden">
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-full h-full max-w-5xl pointer-events-none opacity-40">
            <div class="absolute -top-10 left-10 w-72 h-72 bg-orange-300 rounded-full mix-blend-multiply filter blur-3xl opacity-30"></div>
            <div class="absolute top-10 right-10 w-72 h-72 bg-yellow-200 rounded-full mix-blend-multiply filter blur-3xl opacity-30"></div>
        </div>

        <div class="max-w-4xl mx-auto px-6 relative z-10 text-center">
            <span class="inline-block px-4 py-1.5 mb-4 text-xs font-bold tracking-widest text-orange-600 uppercase bg-orange-100 rounded-full">
                Eksplorasi Katalog
            </span>
            <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight mb-5 text-slate-900">
                Katalog <span class="text-orange-500">Souvenir</span>
            </h1>
            <p class="text-lg text-slate-500 mb-10 max-w-2xl mx-auto">
                Temukan berbagai macam souvenir 3D unik hasil karya kreator, atau kustomisasi desain sesuai gayamu sendiri.
            </p>

            <!-- Search bar -->
            <div class="relative max-w-2xl mx-auto mb-8 shadow-xl shadow-slate-200/50 rounded-full group">
                <div class="absolute inset-y-0 left-0 pl-6 flex items-center pointer-events-none">
                    <svg class="w-6 h-6 text-slate-400 group-focus-within:text-orange-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
                <input type="text" id="searchInput" placeholder="Cari gantungan kunci, kaos kaki..." class="w-full pl-16 pr-32 py-5 bg-white border border-slate-200 rounded-full focus:outline-none focus:ring-4 focus:ring-orange-500/20 focus:border-orange-500 transition-all text-slate-700 font-medium placeholder-slate-400 text-lg"
                    onkeyup="renderProducts()">
                <button class="absolute right-2.5 top-2.5 bottom-2.5 bg-orange-500 hover:bg-orange-600 text-white px-8 rounded-full font-bold transition shadow-md hover:shadow-lg" onclick="renderProducts()">
                    Cari
                </button>
            </div>

            <!-- Category pills -->
            <div class="flex flex-wrap justify-center gap-3" id="categoryContainer"></div>
        </div>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="max-w-7xl mx-auto px-6 py-12">

        <!-- Toolbar: title + sort -->
        <div class="flex flex-wrap justify-between items-center mb-8 gap-4">
            <h2 class="text-2xl font-bold text-slate-800">Rekomendasi Teratas</h2>

            <div class="flex items-center gap-4">
                <span id="productCount" class="text-slate-500 text-sm font-medium">Memuat...</span>

                <!-- Sort dropdown -->
                <div class="relative">
                    <select id="sortSelect" onchange="renderProducts()" class="appearance-none bg-white border border-slate-200 text-slate-600 text-sm font-semibold pl-4 pr-10 py-2.5 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-500/30 focus:border-orange-500 transition shadow-sm">
                        <option value="default">Urutkan: Default</option>
                        <option value="price_asc">Harga: Termurah</option>
                        <option value="price_desc">Harga: Termahal</option>
                        <option value="name_asc">Nama: A–Z</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-3 flex items-center text-slate-400">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                    </div>
                </div>
            </div>
        </div>

        <!-- Product grid -->
        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
            <!-- Skeleton loading placeholder (4 cards) -->
            <div class="bg-white rounded-3xl p-4 border border-slate-100 shadow-sm flex flex-col gap-4">
                <div class="skeleton aspect-square rounded-2xl"></div>
                <div class="skeleton h-5 w-3/4"></div>
                <div class="skeleton h-4 w-full"></div>
                <div class="skeleton h-4 w-1/2"></div>
            </div>
            <div class="bg-white rounded-3xl p-4 border border-slate-100 shadow-sm flex flex-col gap-4">
                <div class="skeleton aspect-square rounded-2xl"></div>
                <div class="skeleton h-5 w-3/4"></div>
                <div class="skeleton h-4 w-full"></div>
                <div class="skeleton h-4 w-1/2"></div>
            </div>
            <div class="bg-white rounded-3xl p-4 border border-slate-100 shadow-sm flex flex-col gap-4">
                <div class="skeleton aspect-square rounded-2xl"></div>
                <div class="skeleton h-5 w-3/4"></div>
                <div class="skeleton h-4 w-full"></div>
                <div class="skeleton h-4 w-1/2"></div>
            </div>
            <div class="bg-white rounded-3xl p-4 border border-slate-100 shadow-sm flex flex-col gap-4">
                <div class="skeleton aspect-square rounded-2xl"></div>
                <div class="skeleton h-5 w-3/4"></div>
                <div class="skeleton h-4 w-full"></div>
                <div class="skeleton h-4 w-1/2"></div>
            </div>
        </div>

    </main>

    <script>
        // ==========================================================
        // CONFIG
        // ==========================================================
        const API_BASE = 'http://localhost:3000';
        const fmtRupiah = (n) => 'Rp ' + Number(n || 0).toLocaleString('id-ID');
        const FALLBACK_IMG = 'https://via.placeholder.com/400x400?text=No+Image';

        // ==========================================================
        // STATE
        // ==========================================================
        let allProducts = [];
        let currentCategory = 'all';
        let cartItemCount = 0;

        // ==========================================================
        // FETCH
        // ==========================================================
        async function loadProducts() {
            try {
                const res = await fetch(`${API_BASE}/api/products?status=aktif`);
                const json = await res.json();
                if (!json.success) throw new Error(json.message);
                allProducts = json.data;
                renderCategoryButtons();
                renderProducts();
            } catch (err) {
                document.getElementById('productGrid').innerHTML = `
                    <div class="col-span-full flex flex-col items-center justify-center py-24 gap-4">
                        <div class="text-5xl">😕</div>
                        <p class="text-xl font-bold text-slate-700">Gagal memuat produk</p>
                        <p class="text-slate-400 text-sm">${err.message}</p>
                        <button onclick="loadProducts()" class="mt-2 bg-orange-500 text-white px-8 py-3 rounded-full font-bold hover:bg-orange-600 transition">Coba Lagi</button>
                    </div>`;
                document.getElementById('productCount').innerText = '0 produk';
            }
        }

        // ==========================================================
        // CATEGORY BUTTONS
        // ==========================================================
        function renderCategoryButtons() {
            const container = document.getElementById('categoryContainer');
            const categories = [...new Set(allProducts.map(p => p.kategori).filter(Boolean))];

            const buttons = ['all', ...categories].map(cat => {
                const label = cat === 'all' ? 'Semua' : cat;
                const isActive = cat === currentCategory;
                const cls = isActive ?
                    "category-btn px-6 py-2.5 rounded-full text-sm font-bold transition bg-slate-900 text-white shadow-lg border border-slate-900" :
                    "category-btn px-6 py-2.5 rounded-full text-sm font-bold transition bg-white text-slate-600 border border-slate-200 hover:border-orange-500 hover:text-orange-500 hover:bg-orange-50";
                return `<button onclick="setCategory('${cat}', this)" class="${cls}">${label}</button>`;
            });
            container.innerHTML = buttons.join('');
        }

        function setCategory(category, element) {
            currentCategory = category;
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.className = "category-btn px-6 py-2.5 rounded-full text-sm font-bold transition bg-white text-slate-600 border border-slate-200 hover:border-orange-500 hover:text-orange-500 hover:bg-orange-50";
            });
            element.className = "category-btn px-6 py-2.5 rounded-full text-sm font-bold transition bg-slate-900 text-white shadow-lg border border-slate-900";
            renderProducts();
        }

        // ==========================================================
        // SORT
        // ==========================================================
        function getSortedProducts(arr) {
            const sort = document.getElementById('sortSelect').value;
            const copy = [...arr];
            if (sort === 'price_asc') return copy.sort((a, b) => (a.harga_jual || 0) - (b.harga_jual || 0));
            if (sort === 'price_desc') return copy.sort((a, b) => (b.harga_jual || 0) - (a.harga_jual || 0));
            if (sort === 'name_asc') return copy.sort((a, b) => (a.nama_produk || '').localeCompare(b.nama_produk || ''));
            return copy; // default
        }

        // ==========================================================
        // RENDER GRID
        // ==========================================================
        function renderProducts() {
            const grid = document.getElementById('productGrid');
            const search = (document.getElementById('searchInput').value || '').toLowerCase();

            let filtered = allProducts.filter(p => {
                const matchSearch = (p.nama_produk || '').toLowerCase().includes(search);
                const matchCategory = currentCategory === 'all' || p.kategori === currentCategory;
                return matchSearch && matchCategory;
            });

            filtered = getSortedProducts(filtered);
            document.getElementById('productCount').innerText = `Menampilkan ${filtered.length} produk`;

            if (!filtered.length) {
                grid.innerHTML = `
                    <div class="col-span-full flex flex-col items-center justify-center py-24 gap-4">
                        <div class="text-5xl">🔍</div>
                        <p class="text-xl font-bold text-slate-700">Produk tidak ditemukan</p>
                        <p class="text-slate-400 text-sm">Coba kata kunci atau kategori lain.</p>
                        <button onclick="resetFilter()" class="mt-2 bg-orange-500 text-white px-8 py-3 rounded-full font-bold hover:bg-orange-600 transition">Reset Filter</button>
                    </div>`;
                return;
            }

            grid.innerHTML = filtered.map(p => `
                <div class="product-card bg-white rounded-3xl p-4 shadow-sm border border-slate-100 flex flex-col">

                    <!-- Image + hover overlay -->
                    <a href="product-detail.html?id=${p.id}" class="block relative overflow-hidden rounded-2xl mb-4">
                        <div class="aspect-square bg-slate-100">
                            <img src="${p.foto_url || FALLBACK_IMG}" alt="${p.nama_produk}"
                                class="w-full h-full object-cover transition duration-300 group-hover:scale-105"
                                onerror="this.src='${FALLBACK_IMG}'">
                        </div>

                        ${p.kategori ? `<span class="absolute top-3 left-3 bg-white/90 backdrop-blur text-xs font-bold px-3 py-1 rounded-full text-slate-700">${p.kategori}</span>` : ''}

                        <!-- Hover overlay -->
                        <div class="hover-overlay absolute inset-0 bg-slate-900/50 flex items-center justify-center rounded-2xl">
                            <span class="bg-white text-slate-900 font-bold text-sm px-6 py-2.5 rounded-full shadow-lg hover:bg-orange-500 hover:text-white transition">
                                Lihat Detail →
                            </span>
                        </div>
                    </a>

                    <!-- Info -->
                    <div class="flex-grow px-1">
                        <h3 class="font-bold text-lg text-slate-800 line-clamp-1 hover:text-orange-500 transition">${p.nama_produk}</h3>
                        <p class="text-slate-400 text-sm mt-1 mb-4 line-clamp-1">${p.deskripsi || ''}</p>
                    </div>

                    <!-- Price + add to cart -->
                    <div class="flex justify-between items-center px-1 mt-auto">
                        <p class="text-orange-500 font-extrabold text-xl">${fmtRupiah(p.harga_jual)}</p>
                        <button onclick="addToCart(${p.id}, event)"
                            class="bg-slate-50 hover:bg-orange-500 hover:text-white text-slate-700 w-10 h-10 rounded-full flex items-center justify-center transition border border-slate-200 hover:border-orange-500 text-lg font-bold z-10 relative"
                            title="Tambah ke keranjang">
                            +
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function resetFilter() {
            document.getElementById('searchInput').value = '';
            currentCategory = 'all';
            renderCategoryButtons();
            renderProducts();
        }

        // ==========================================================
        // CART
        // ==========================================================
        function addToCart(productId, event) {
            event.preventDefault(); // jangan trigger link parent
            cartItemCount++;
            const badge = document.getElementById('cartBadge');
            badge.innerText = cartItemCount;
            badge.classList.remove('hidden');
            badge.classList.add('animate-bounce');
            setTimeout(() => badge.classList.remove('animate-bounce'), 1000);
        }

        // ==========================================================
        // INIT
        // ==========================================================
        window.onload = loadProducts;
    </script>
</body>

</html>
