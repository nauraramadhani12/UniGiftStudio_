<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | Uni Gift Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); }
    </style>
</head>

<body class="bg-slate-50 text-slate-900">

    <nav class="glass sticky top-0 z-50 border-b border-slate-200">
        <div class="max-w-7xl mx-auto flex justify-between items-center p-5">
            <div class="flex items-center gap-2">
                <div class="w-10 h-10 bg-orange-500 rounded-xl flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-orange-200">U</div>
                <h1 class="text-2xl font-extrabold tracking-tight">Uni Gift <span class="text-orange-500">Studio</span></h1>
            </div>

            <div class="hidden md:flex space-x-10 font-semibold text-slate-600">
                <a href="index.html" class="hover:text-orange-500 transition">Home</a>
                <a href="products.html" class="text-orange-600">Products</a>
                <a href="custom-ai.html" class="hover:text-orange-500 transition">Custom AI</a>
            </div>

            <div id="authMenu" class="flex items-center gap-6">
                <a href="cart.html" onclick="requireLogin(event)" class="relative text-slate-600 hover:text-orange-500 transition group" title="Lihat Keranjang">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                    <span id="cartBadge" class="absolute -top-2 -right-2 bg-orange-500 text-white text-[10px] font-bold w-5 h-5 flex items-center justify-center rounded-full border-2 border-white hidden">0</span>
                </a>
                <a href="login.html" class="font-semibold text-slate-600 hover:text-orange-500 transition">Login</a>
                <a href="register.html" class="bg-slate-900 text-white px-6 py-2.5 rounded-full font-bold hover:bg-orange-600 transition shadow-lg shadow-slate-200 hidden sm:block">Join Now</a>
            </div>
        </div>
    </nav>

    <header class="relative bg-gradient-to-b from-orange-100/50 to-slate-50 pt-16 pb-12 border-b border-slate-200 overflow-hidden">
        <div class="max-w-4xl mx-auto px-6 relative z-10 text-center">
            <span class="inline-block px-4 py-1.5 mb-4 text-xs font-bold tracking-widest text-orange-600 uppercase bg-orange-100 rounded-full">Eksplorasi Katalog</span>
            <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight mb-5 text-slate-900">Katalog <span class="text-orange-500">Souvenir</span></h1>
            
            <div class="relative max-w-2xl mx-auto mb-8 shadow-xl shadow-slate-200/50 rounded-full group mt-10">
                <div class="absolute inset-y-0 left-0 pl-6 flex items-center pointer-events-none">
                    <svg class="w-6 h-6 text-slate-400 group-focus-within:text-orange-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
                <input type="text" id="searchInput" placeholder="Cari gantungan kunci, kaos kaki..." 
                    class="w-full pl-16 pr-32 py-5 bg-white border border-slate-200 rounded-full focus:outline-none focus:ring-4 focus:ring-orange-500/20 focus:border-orange-500 transition-all text-slate-700 font-medium placeholder-slate-400 text-lg" onkeyup="renderProducts()">
                <button class="absolute right-2.5 top-2.5 bottom-2.5 bg-orange-500 hover:bg-orange-600 text-white px-8 rounded-full font-bold transition shadow-md" onclick="renderProducts()">Cari</button>
            </div>

            <div class="flex flex-wrap justify-center gap-3" id="categoryContainer">
                <button onclick="setCategory('all', this)" class="category-btn px-6 py-2.5 rounded-full text-sm font-bold transition bg-slate-900 text-white shadow-lg border border-slate-900">Semua</button>
                <button onclick="setCategory('keychain', this)" class="category-btn px-6 py-2.5 rounded-full text-sm font-bold transition bg-white text-slate-600 border border-slate-200 hover:border-orange-500 hover:text-orange-500">Gantungan Kunci</button>
                <button onclick="setCategory('statue', this)" class="category-btn px-6 py-2.5 rounded-full text-sm font-bold transition bg-white text-slate-600 border border-slate-200 hover:border-orange-500 hover:text-orange-500">Mini Statue</button>
                <button onclick="setCategory('socks', this)" class="category-btn px-6 py-2.5 rounded-full text-sm font-bold transition bg-white text-slate-600 border border-slate-200 hover:border-orange-500 hover:text-orange-500">Kaos Kaki</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-12 pb-40">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-2xl font-bold text-slate-800">Rekomendasi Teratas</h2>
        </div>
        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
            <div class="col-span-full text-center py-10">
                <div class="w-10 h-10 border-4 border-orange-500/20 border-t-orange-500 rounded-full animate-spin mx-auto mb-4"></div>
            </div>
        </div>
    </main>

    <script>
        let allProducts = [];
        let currentCategory = 'all';

        window.onload = function() {
            checkLoginStatus();
            fetchProducts();
        };

        function checkLoginStatus() {
            const userData = localStorage.getItem('userSession');
            if (userData) {
                const user = JSON.parse(userData);
                document.getElementById('authMenu').innerHTML = `
                    <a href="cart.html" class="relative text-slate-600 hover:text-orange-500 transition group mr-2">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                        <span id="cartBadge" class="absolute -top-2 -right-2 bg-orange-500 text-white text-[10px] font-bold w-5 h-5 flex items-center justify-center rounded-full border-2 border-white hidden">0</span>
                    </a>
                    <div class="flex items-center gap-3 ml-2">
                        <span class="font-bold text-slate-800">Halo, ${user.nama_lengkap.split(' ')[0]}!</span>
                        <a href="order-history.html" class="text-xs bg-orange-50 hover:bg-orange-500 hover:text-white text-orange-600 font-bold px-4 py-2 rounded-full transition border border-orange-200">Pesanan Saya</a>
                        <button onclick="logout()" class="text-xs bg-slate-100 hover:bg-red-100 text-slate-600 hover:text-red-600 font-bold px-4 py-2 rounded-full transition border border-slate-200">Keluar</button>
                    </div>
                `;
                updateCartBadge();
            }
        }

        function logout() {
            localStorage.removeItem('userSession');
            window.location.reload();
        }

        function requireLogin(e) {
            const userData = localStorage.getItem('userSession');
            if (!userData) {
                e.preventDefault();
                alert("Oops! Harap Login terlebih dahulu untuk berbelanja.");
                window.location.href = 'login.html';
            }
        }

        function updateCartBadge() {
            const badge = document.getElementById('cartBadge');
            if (!badge) return;
            
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            let totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            
            if(totalItems > 0) {
                badge.innerText = totalItems;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        async function fetchProducts() {
            try {
                const response = await fetch('http://localhost:3000/api/products?status=aktif');
                const json = await response.json();
                allProducts = Array.isArray(json) ? json : (json.data || []);
                renderProducts();
            } catch (error) {
                document.getElementById('productGrid').innerHTML = '<p class="col-span-full text-center text-red-500 font-bold">Server belum menyala.</p>';
            }
        }

        function renderStars(rating) {
            let html = '<div class="flex">';
            const r = Math.round(rating);
            for (let i = 1; i <= 5; i++) {
                const colorClass = i <= r ? 'text-yellow-400' : 'text-slate-200';
                html += `<svg class="w-4 h-4 ${colorClass}" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>`;
            }
            html += '</div>';
            return html;
        }

        function renderProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = ''; 
            let input = document.getElementById("searchInput").value.toLowerCase();

            const filteredProducts = allProducts.filter(p => {
                let matchesSearch = p.nama_produk.toLowerCase().includes(input);
                let matchesCategory = (currentCategory === "all" || (p.kategori && p.kategori.toLowerCase() === currentCategory.toLowerCase()));
                return matchesSearch && matchesCategory;
            });

            filteredProducts.forEach(p => {
                const hargaRupiah = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(p.harga_jual);
                const badgeText = p.kategori.charAt(0).toUpperCase() + p.kategori.slice(1);
                
                let imgContainerClass = 'bg-slate-100';
                let extraFlexClass = '';
                let imgHtml = '';

                if (p.foto_url) {
                    imgHtml = `<img src="${p.foto_url}" class="w-full h-full object-cover" onerror="this.parentElement.innerHTML='<span class=\\'text-4xl flex items-center justify-center h-full\\'><svg xmlns=\\'http://www.w3.org/2000/svg\\' viewBox=\\'0 0 24 24\\' fill=\\'none\\' stroke=\\'currentColor\\' stroke-width=\\'1.75\\' stroke-linecap=\\'round\\' stroke-linejoin=\\'round\\' class=\\'w-9 h-9\\'><rect x=\\'3\\' y=\\'8\\' width=\\'18\\' height=\\'13\\' rx=\\'1\\'/><path d=\\'M3 8h18M12 8v13M12 8c-1.5-3-5-4-6-2s1 3 3 2 3-1 3-3-1.5-3-3-3\\'/><path d=\\'M12 8c1.5-3 5-4 6-2s-1 3-3 2-3-1-3-3 1.5-3 3-3\\'/></svg></span>'">`;
                } else {
                    imgContainerClass = 'bg-orange-50';
                    extraFlexClass = 'flex items-center justify-center';
                    imgHtml = `<span class="text-5xl"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="w-12 h-12"><rect x="3" y="8" width="18" height="13" rx="1"/><path d="M3 8h18M12 8v13M12 8c-1.5-3-5-4-6-2s1 3 3 2 3-1 3-3-1.5-3-3-3"/><path d="M12 8c1.5-3 5-4 6-2s-1 3-3 2-3-1-3-3 1.5-3 3-3"/></svg></span>`;
                }

                const isHabis = p.stok === 0;
                const opacityClass = isHabis ? 'opacity-70' : '';
                
                // PENTING: Tombol Add to Cart sekarang memanggil fungsi dengan membawa p.id
                const btnHtml = isHabis 
                    ? `<button disabled class="bg-slate-100 text-slate-400 text-xs font-bold w-10 h-10 rounded-full flex items-center justify-center cursor-not-allowed">Habis</button>`
                    : `<button onclick="addToCart(${p.id})" class="bg-slate-50 hover:bg-orange-500 hover:text-white text-slate-700 w-10 h-10 rounded-full flex items-center justify-center transition border border-slate-200 z-10 relative">+</button>`;

                grid.innerHTML += `
                <div class="product ${p.kategori} bg-white rounded-3xl p-4 shadow-sm border border-slate-100 hover:shadow-xl hover:-translate-y-1 transition duration-300 relative flex flex-col ${opacityClass}">
                    <a href="product-detail.html?id=${p.id}" class="block cursor-pointer flex-grow">
                        <div class="aspect-square ${imgContainerClass} rounded-2xl mb-4 overflow-hidden relative ${extraFlexClass}">
                            ${imgHtml}
                            <span class="absolute top-3 left-3 bg-white/90 backdrop-blur text-xs font-bold px-3 py-1 rounded-full text-slate-700">${badgeText}</span>
                        </div>
                        <h3 class="font-bold text-lg text-slate-800 line-clamp-1 px-1 hover:text-orange-500 transition">${p.nama_produk}</h3>
                        
                        <div class="flex items-center gap-1.5 px-1 mt-1 mb-3">
                            ${renderStars(p.rata_rating)}
                            <span class="text-xs font-bold text-slate-500">${Number(p.rata_rating).toFixed(1)} (${p.total_terjual || 0})</span>
                        </div>
                    </a>
                    <div class="flex justify-between items-center px-1 mt-auto">
                        <p class="text-orange-500 font-extrabold text-xl">${hargaRupiah}</p>
                        ${btnHtml}
                    </div>
                </div>
                `;
            });
        }

        // FUNGSI UTAMA: Memasukkan barang ke LocalStorage
        function addToCart(productId) {
            const userData = localStorage.getItem('userSession');
            if (!userData) {
                alert("Oops! Harap Login terlebih dahulu untuk berbelanja.");
                window.location.href = 'login.html';
                return;
            }

            const product = allProducts.find(p => p.id === productId);
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            
            let existingItem = cart.find(item => item.id === productId);
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                const imgHtml = product.foto_url
                    ? `<img src="${product.foto_url}" class="w-full h-full object-cover" onerror="this.style.display='none'">`
                    : `<span class="text-2xl"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6"><rect x="3" y="8" width="18" height="13" rx="1"/><path d="M3 8h18M12 8v13M12 8c-1.5-3-5-4-6-2s1 3 3 2 3-1 3-3-1.5-3-3-3"/><path d="M12 8c1.5-3 5-4 6-2s-1 3-3 2-3-1-3-3 1.5-3 3-3"/></svg></span>`;
                const bgClass = product.foto_url ? 'bg-slate-100' : 'bg-orange-50';

                cart.push({
                    id: product.id,
                    name: product.nama_produk,
                    category: product.kategori,
                    price: product.harga_jual,
                    mrp: product.harga_asli || product.harga_jual,
                    quantity: 1,
                    creator_id: product.creator_id,
                    nama_kreator: product.nama_kreator || 'Uni Gift Studio',
                    image: `<div class="w-20 h-20 ${bgClass} rounded-xl flex items-center justify-center shrink-0 overflow-hidden">${imgHtml}</div>`
                });
            }
            
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartBadge();
            
            let badge = document.getElementById('cartBadge');
            badge.classList.add('animate-bounce');
            setTimeout(() => badge.classList.remove('animate-bounce'), 1000);
        }

        function setCategory(category, element) {
            currentCategory = category;
            let buttons = document.querySelectorAll('.category-btn');
            buttons.forEach(btn => btn.className = "category-btn px-6 py-2.5 rounded-full text-sm font-bold transition bg-white text-slate-600 border border-slate-200 hover:border-orange-500 hover:text-orange-500");
            element.className = "category-btn px-6 py-2.5 rounded-full text-sm font-bold transition bg-slate-900 text-white shadow-lg border border-slate-900";
            renderProducts();
        }
    </script>
</body>
</html>
