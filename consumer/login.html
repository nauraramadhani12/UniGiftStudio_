<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Uni Gift Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-900 min-h-screen relative overflow-x-hidden selection:bg-orange-200 selection:text-orange-900">

    <div class="fixed top-0 left-0 w-full h-full pointer-events-none z-0">
        <div class="absolute -top-20 -left-20 w-96 h-96 bg-orange-300 rounded-full mix-blend-multiply filter blur-3xl opacity-40 animate-pulse"></div>
        <div class="absolute bottom-[-10%] right-[-5%] w-96 h-96 bg-yellow-200 rounded-full mix-blend-multiply filter blur-3xl opacity-40"></div>
    </div>

    <a href="index.html" class="fixed top-6 left-6 md:top-8 md:left-8 z-30 flex items-center gap-2 px-5 py-2.5 bg-white/60 hover:bg-white backdrop-blur-md border border-white/60 text-slate-600 hover:text-orange-600 font-bold rounded-full transition-all shadow-sm hover:shadow-md group">
        <svg class="w-5 h-5 group-hover:-translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg> Kembali
        ke Beranda
    </a>

    <div class="flex flex-col min-h-screen w-full py-24 px-6 md:py-12">
        <div class="w-full max-w-md m-auto relative z-10">
            <div class="bg-white/80 backdrop-blur-xl p-8 sm:p-10 rounded-[2.5rem] shadow-2xl border border-white">

                <div class="text-center mb-10 mt-2">
                    <div class="relative inline-flex justify-center items-center mb-6">
                        <div class="absolute inset-0 bg-orange-400 blur-lg opacity-40 rounded-full"></div>
                        <div class="relative inline-flex items-center justify-center w-16 h-16 bg-gradient-to-br from-orange-400 to-orange-600 rounded-2xl text-white font-black text-4xl shadow-xl border-2 border-white ring-4 ring-orange-50/50">U</div>
                    </div>
                    <h2 class="text-3xl font-extrabold text-slate-900 mb-3 tracking-tight">
                        Selamat Datang!
                    </h2>
                    <p class="text-slate-500 text-sm md:text-base font-medium px-2">
                        Senang melihatmu lagi. Yuk masuk ke akun <span class="text-orange-500 font-bold">Uni Gift Studio</span>.
                    </p>
                </div>

                <!-- Pesan sukses dari register -->
                <div id="successBanner" class="hidden mb-5 px-4 py-3 bg-green-50 border border-green-200 rounded-xl text-sm font-bold text-green-700 text-center"></div>

                <!-- Pesan error -->
                <div id="errorBanner" class="hidden mb-5 px-4 py-3 bg-red-50 border border-red-200 rounded-xl text-sm font-bold text-red-600 text-center"></div>

                <form id="loginForm" class="space-y-5">

                    <div>
                        <label for="email" class="block text-sm font-bold text-slate-700 mb-2">Email</label>
                        <input type="email" id="email" placeholder="nama@email.com" required class="w-full px-5 py-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-500 focus:bg-white transition font-medium text-slate-800 placeholder-slate-400">
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <label for="password" class="block text-sm font-bold text-slate-700">Password</label>
                            <a href="#" class="text-xs font-bold text-orange-500 hover:text-orange-600 transition">Lupa Password?</a>
                        </div>
                        <input type="password" id="password" placeholder="••••••••" required class="w-full px-5 py-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-500 focus:bg-white transition font-medium text-slate-800 placeholder-slate-400">
                    </div>

                    <button type="submit" id="btnLogin" class="w-full bg-slate-900 hover:bg-orange-500 text-white font-bold py-4 rounded-xl transition duration-300 shadow-lg shadow-slate-200 hover:shadow-orange-200 mt-2">
                        Masuk Sekarang
                    </button>

                </form>

                <div class="mt-8 flex items-center justify-center space-x-4">
                    <span class="h-px w-full bg-slate-200"></span>
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Atau</span>
                    <span class="h-px w-full bg-slate-200"></span>
                </div>

                <div class="mt-6">
                    <button class="w-full flex items-center justify-center gap-3 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 font-bold py-3.5 rounded-xl transition shadow-sm">
                        <svg class="w-5 h-5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                        </svg>
                        Masuk dengan Google
                    </button>
                </div>

                <p class="text-center mt-8 text-sm text-slate-500 font-medium">
                    Belum punya akun?
                    <a href="register.html" class="text-orange-500 hover:text-orange-600 font-bold transition">Daftar di sini</a>
                </p>

            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3000';

        // Auto-redirect jika sudah login
        const adminToken  = localStorage.getItem('adminToken');
        const adminUser   = JSON.parse(localStorage.getItem('adminUser') || 'null');
        const userToken   = localStorage.getItem('userToken');
        const userSession = JSON.parse(localStorage.getItem('userSession') || 'null');

        if (adminToken && adminUser && adminUser.role === 'admin') {
            window.location.href = '../seller/dashboard_admin.html';
        } else if (userToken && userSession && userSession.role === 'kreator') {
            window.location.href = '../seller/dashboard.html';
        }
        // Pelanggan tidak di-redirect agar tidak loop index ↔ login

        const nextParam = new URLSearchParams(window.location.search).get('next');
        if (nextParam === 'admin') {
            // Kasih hint visual bahwa ini login admin
            document.querySelector('p.text-slate-500').innerHTML =
                'Login sebagai <span class="text-orange-500 font-bold">Admin</span> untuk mengakses dashboard pengelola.';
        }

        // Tampilkan pesan sukses dari register (kalau ada)
        const regMsg = sessionStorage.getItem('registerSuccess');
        if (regMsg) {
            document.getElementById('successBanner').textContent = regMsg;
            document.getElementById('successBanner').classList.remove('hidden');
            sessionStorage.removeItem('registerSuccess');
        }

        // ── Submit login ──────────────────────────────────────────────
        document.getElementById('loginForm').addEventListener('submit', async(e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('btnLogin');
            const errEl = document.getElementById('errorBanner');

            errEl.classList.add('hidden');
            btn.disabled = true;
            btn.textContent = 'Memproses...';

            try {
                const res = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email,
                        password
                    })
                });
                const json = await res.json();

                if (!json.success) throw new Error(json.message);

                const {
                    token,
                    user
                } = json;

                // Simpan token & data user ke localStorage
                if (user.role === 'admin') {
                    localStorage.setItem('adminToken', token);
                    localStorage.setItem('adminUser', JSON.stringify(user));
                } else {
                    localStorage.setItem('userToken', token);
                    localStorage.setItem('userSession', JSON.stringify(user));
                }

                redirectByRole(user.role);

            } catch (err) {
                errEl.textContent = err.message;
                errEl.classList.remove('hidden');
                btn.disabled = false;
                btn.textContent = 'Masuk Sekarang';
            }
        });

        // ── Redirect berdasarkan role ─────────────────────────────────
        function redirectByRole(role) {
            if (role === 'admin') {
                window.location.href = '../seller/dashboard_admin.html';
            } else if (role === 'kreator') {
                window.location.href = '../seller/dashboard.html';
            } else {
                window.location.href = 'index.html';
            }
        }
    </script>

</body>

</html>
